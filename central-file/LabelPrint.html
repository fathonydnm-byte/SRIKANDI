const FOLDER_LABEL_LOGO_JPEG_READY_=FOLDER_LABEL_LOGO_JPEG_SMALL_.slice(0,144)+'JCQk'+FOLDER_LABEL_LOGO_JPEG_SMALL_.slice(144);

function downloadFolderLabelsPdf_(payload){
  const blob=buildFolderLabelsPdfBlob_(payload);
  const url=URL.createObjectURL(blob);
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=payload.fileName||'Lidah_Folder.pdf';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  return {pageCount:Math.ceil(((Number(payload.startSlot)||1)-1+(payload.labels||[]).length)/14),sizeBytes:blob.size};
}

function buildFolderLabelsPdfBlob_(payload){
  const bytes=buildFolderLabelsPdfBytes_(payload.labels||[],Number(payload.startSlot)||1);
  return new Blob([bytes],{type:'application/pdf'});
}

function buildFolderLabelsPdfBytes_(labels,startSlot){
  if(!Array.isArray(labels)||!labels.length)throw new Error('Tidak ada lidah folder untuk dibuat.');
  if(!Number.isInteger(startSlot)||startSlot<1||startSlot>14)throw new Error('Posisi awal label tidak valid.');
  const pageWidth=595.276;
  const pageHeight=841.89;
  const marginLeft=72;
  const marginTop=72;
  const labelWidth=198.425;
  const labelHeight=85.039;
  const pageCount=Math.ceil((startSlot-1+labels.length)/14);
  const objects=[null,null,null];
  const addObject=bytes=>{objects.push(typeof bytes==='string'?pdfAsciiBytes_(bytes):bytes);return objects.length-1};
  const regularFont=addObject('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>');
  const boldFont=addObject('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>');
  const logoBytes=pdfBase64Bytes_(FOLDER_LABEL_LOGO_HD_JPEG_);
  const logoObject=addObject(pdfStreamObjectBytes_('/Type /XObject /Subtype /Image /Name /Im1 /Width 319 /Height 315 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Interpolate true',logoBytes));
  const pageObjects=[];

  for(let pageIndex=0;pageIndex<pageCount;pageIndex++){
    const commands=[];
    for(let slot=0;slot<14;slot++){
      const row=Math.floor(slot/2);
      const column=slot%2;
      const x=marginLeft+column*labelWidth;
      const top=pageHeight-marginTop-row*labelHeight;
      const bottom=top-labelHeight;
      commands.push('q 0 0 0 RG 1.5 w '+pdfNumber_(x)+' '+pdfNumber_(bottom)+' '+pdfNumber_(labelWidth)+' '+pdfNumber_(labelHeight)+' re S Q');
      const globalSlot=pageIndex*14+slot;
      const labelIndex=globalSlot-(startSlot-1);
      if(labelIndex>=0&&labelIndex<labels.length){
        commands.push(drawFolderLabelPdf_(labels[labelIndex],x,top,labelWidth,labelHeight));
      }
    }
    const contentBytes=pdfAsciiBytes_(commands.join('\n'));
    const contentObject=addObject(pdfStreamObjectBytes_('',contentBytes));
    const pageObject=addObject(
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pdfNumber_(pageWidth)+' '+pdfNumber_(pageHeight)+'] '+
      '/Resources << /ProcSet [/PDF /Text /ImageC] /Font << /F1 '+regularFont+' 0 R /F2 '+boldFont+' 0 R >> /XObject << /Im1 '+logoObject+' 0 R >> >> '+
      '/Contents '+contentObject+' 0 R >>'
    );
    pageObjects.push(pageObject);
  }

  objects[1]=pdfAsciiBytes_('<< /Type /Catalog /Pages 2 0 R >>');
  objects[2]=pdfAsciiBytes_('<< /Type /Pages /Count '+pageObjects.length+' /Kids ['+pageObjects.map(number=>number+' 0 R').join(' ')+'] >>');
  return assemblePdfObjects_(objects);
}

function drawFolderLabelPdf_(label,x,top,width,height){
  const mm=72/25.4;
  const left=x+4*mm;
  const headerBaseline=top-6.2*mm;
  const logoSize=12.5*mm;
  const logoX=x+width-2*mm-logoSize;
  const logoY=top-2*mm-logoSize;
  const header=normalizeFolderLabelPdfText_((label.classificationCode||'TANPA KODE')+' | '+(label.number||'–'));
  let headerSize=12;
  const headerMaxWidth=logoX-left-2*mm;
  while(headerSize>9&&measureFolderLabelPdfText_(header,headerSize,true)>headerMaxWidth)headerSize-=.5;

  const title=normalizeFolderLabelPdfText_(label.title||'Tanpa Judul');
  const titleWidth=width-8*mm;
  const titleTop=top-17*mm;
  const titleBottom=top-height+2.2*mm;
  let titleSize=11.5;
  let titleLines=[];
  while(titleSize>=7.5){
    titleLines=wrapFolderLabelPdfText_(title,titleWidth,titleSize,false);
    const lineHeight=titleSize*1.08;
    if(titleLines.length*lineHeight<=titleTop-titleBottom+.1)break;
    titleSize-=.5;
  }
  const maxLines=Math.max(1,Math.floor((titleTop-titleBottom)/(titleSize*1.08)));
  if(titleLines.length>maxLines){
    titleLines=titleLines.slice(0,maxLines);
    let last=titleLines[maxLines-1];
    while(last.length&&measureFolderLabelPdfText_(last+'...',titleSize,false)>titleWidth)last=last.slice(0,-1).trim();
    titleLines[maxLines-1]=(last||'').replace(/[.,;:]+$/,'')+'...';
  }

  const commands=[
    'q '+pdfNumber_(logoSize)+' 0 0 '+pdfNumber_(logoSize)+' '+pdfNumber_(logoX)+' '+pdfNumber_(logoY)+' cm /Im1 Do Q',
    'BT /F2 '+pdfNumber_(headerSize)+' Tf '+pdfNumber_(left)+' '+pdfNumber_(headerBaseline)+' Td ('+pdfEscapeText_(header)+') Tj ET'
  ];
  titleLines.forEach((line,index)=>{
    commands.push('BT /F1 '+pdfNumber_(titleSize)+' Tf '+pdfNumber_(left)+' '+pdfNumber_(titleTop-index*titleSize*1.08)+' Td ('+pdfEscapeText_(line)+') Tj ET');
  });
  return commands.join('\n');
}

function wrapFolderLabelPdfText_(text,maxWidth,fontSize,bold){
  const words=String(text||'').split(/\s+/).filter(Boolean);
  const lines=[];
  let current='';
  words.forEach(word=>{
    const candidate=current?current+' '+word:word;
    if(measureFolderLabelPdfText_(candidate,fontSize,bold)<=maxWidth){
      current=candidate;
      return;
    }
    if(current){lines.push(current);current=''}
    if(measureFolderLabelPdfText_(word,fontSize,bold)<=maxWidth){current=word;return}
    let part='';
    Array.from(word).forEach(character=>{
      if(part&&measureFolderLabelPdfText_(part+character,fontSize,bold)>maxWidth){lines.push(part);part=character}
      else part+=character;
    });
    current=part;
  });
  if(current)lines.push(current);
  return lines.length?lines:[''];
}

function measureFolderLabelPdfText_(text,fontSize,bold){
  if(typeof document!=='undefined'&&document.createElement){
    if(!measureFolderLabelPdfText_.canvas)measureFolderLabelPdfText_.canvas=document.createElement('canvas');
    const context=measureFolderLabelPdfText_.canvas.getContext&&measureFolderLabelPdfText_.canvas.getContext('2d');
    if(context){
      context.font=(bold?'bold ':'')+fontSize+'pt "Times New Roman", serif';
      return context.measureText(String(text)).width*.75;
    }
  }
  return Array.from(String(text)).reduce((sum,character)=>{
    if(character===' ')return sum+fontSize*.24;
    if(/[MW@#%]/.test(character))return sum+fontSize*.82;
    if(/[ilI1.,;:|]/.test(character))return sum+fontSize*.27;
    if(/[A-Z0-9]/.test(character))return sum+fontSize*.58;
    return sum+fontSize*.48;
  },0)*(bold?1.04:1);
}

function normalizeFolderLabelPdfText_(value){
  return String(value||'')
    .normalize('NFKD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[–—]/g,'-')
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/[^\x20-\x7E]/g,'?')
    .replace(/\s+/g,' ')
    .trim();
}

function pdfEscapeText_(value){
  return String(value).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}

function pdfNumber_(value){
  return Number(value).toFixed(3).replace(/\.?0+$/,'');
}

function pdfAsciiBytes_(value){
  const text=String(value);
  const bytes=new Uint8Array(text.length);
  for(let index=0;index<text.length;index++)bytes[index]=text.charCodeAt(index)&255;
  return bytes;
}

function pdfBase64Bytes_(base64){
  const binary=atob(base64);
  const bytes=new Uint8Array(binary.length);
  for(let index=0;index<binary.length;index++)bytes[index]=binary.charCodeAt(index);
  return bytes;
}

function pdfConcatBytes_(parts){
  const total=parts.reduce((sum,part)=>sum+part.length,0);
  const result=new Uint8Array(total);
  let offset=0;
  parts.forEach(part=>{result.set(part,offset);offset+=part.length});
  return result;
}

function pdfStreamObjectBytes_(dictionary,data){
  return pdfConcatBytes_([
    pdfAsciiBytes_('<< '+dictionary+' /Length '+data.length+' >>\nstream\n'),
    data,
    pdfAsciiBytes_('\nendstream')
  ]);
}

function assemblePdfObjects_(objects){
  const chunks=[pdfAsciiBytes_('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n')];
  const offsets=[0];
  let size=chunks[0].length;
  for(let number=1;number<objects.length;number++){
    offsets[number]=size;
    const chunk=pdfConcatBytes_([
      pdfAsciiBytes_(number+' 0 obj\n'),
      objects[number],
      pdfAsciiBytes_('\nendobj\n')
    ]);
    chunks.push(chunk);
    size+=chunk.length;
  }
  const xrefOffset=size;
  const xref=['xref','0 '+objects.length,'0000000000 65535 f '];
  for(let number=1;number<objects.length;number++)xref.push(String(offsets[number]).padStart(10,'0')+' 00000 n ');
  xref.push('trailer','<< /Size '+objects.length+' /Root 1 0 R >>','startxref',String(xrefOffset),'%%EOF');
  chunks.push(pdfAsciiBytes_(xref.join('\n')+'\n'));
  return pdfConcatBytes_(chunks);
}
