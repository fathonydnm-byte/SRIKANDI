
<script>
function downloadReceiptPdf_(payload){
  const bytes=buildReceiptPdfBytes_(payload);
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const anchor=document.createElement('a');
  anchor.href=url;
  anchor.download=payload.fileName||'Tanda_Terima_Penyerahan_Arsip.pdf';
  document.body.appendChild(anchor);
  anchor.click();
  anchor.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  return {pageCount:receiptPdfPageCount_(payload),sizeBytes:blob.size};
}

function buildReceiptPdfBytes_(payload){
  if(!payload||!Array.isArray(payload.items)||!payload.items.length){
    throw new Error('Data tanda terima tidak lengkap.');
  }
  const pageWidth=595.276;
  const pageHeight=841.89;
  const objects=[null,null,null];
  const addObject=value=>{
    objects.push(typeof value==='string'?pdfAsciiBytes_(value):value);
    return objects.length-1;
  };
  const regularFont=addObject('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Roman /Encoding /WinAnsiEncoding >>');
  const boldFont=addObject('<< /Type /Font /Subtype /Type1 /BaseFont /Times-Bold /Encoding /WinAnsiEncoding >>');
  const logoBytes=pdfBase64Bytes_(FOLDER_LABEL_LOGO_HD_JPEG_);
  const logoObject=addObject(pdfStreamObjectBytes_(
    '/Type /XObject /Subtype /Image /Name /Im1 /Width 319 /Height 315 '+
    '/ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Interpolate true',
    logoBytes
  ));
  const pages=receiptBuildPages_(payload);
  const pageObjects=[];
  pages.forEach(page=>{
    const commands=page.mode==='HALF'
      ?receiptDrawHalfPage_(payload,pageWidth,pageHeight)
      :receiptDrawFullPage_(payload,page,pageWidth,pageHeight);
    const contentObject=addObject(pdfStreamObjectBytes_('',pdfAsciiBytes_(commands.join('\n'))));
    pageObjects.push(addObject(
      '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pdfNumber_(pageWidth)+' '+pdfNumber_(pageHeight)+'] '+
      '/Resources << /ProcSet [/PDF /Text /ImageC] '+
      '/Font << /F1 '+regularFont+' 0 R /F2 '+boldFont+' 0 R >> '+
      '/XObject << /Im1 '+logoObject+' 0 R >> >> '+
      '/Contents '+contentObject+' 0 R >>'
    ));
  });
  objects[1]=pdfAsciiBytes_('<< /Type /Catalog /Pages 2 0 R >>');
  objects[2]=pdfAsciiBytes_('<< /Type /Pages /Count '+pageObjects.length+
    ' /Kids ['+pageObjects.map(number=>number+' 0 R').join(' ')+'] >>');
  return assemblePdfObjects_(objects);
}

function receiptPdfPageCount_(payload){
  return receiptBuildPages_(payload).length;
}

function receiptBuildPages_(payload){
  if(receiptCanUseHalfPage_(payload))return[{mode:'HALF'}];
  const copies=['UNTUK PENYERAH','UNTUK PENERIMA'];
  const result=[];
  copies.forEach(copyLabel=>{
    const pagination=receiptPaginateItems_(payload);
    pagination.forEach((page,index)=>result.push({
      mode:'FULL',
      copyLabel:copyLabel,
      segments:page.segments,
      isLast:page.isLast,
      copyPage:index+1,
      copyPageCount:pagination.length
    }));
  });
  return result;
}

function receiptCanUseHalfPage_(payload){
  if((payload.items||[]).length>3)return false;
  const descriptionLines=(payload.items||[]).reduce((sum,item)=>
    sum+wrapFolderLabelPdfText_(
      normalizeFolderLabelPdfText_(item.description||''),275,7.2,false
    ).length,0);
  const noteLines=wrapFolderLabelPdfText_(
    normalizeFolderLabelPdfText_(payload.notes||''),470,7,false
  ).length;
  return descriptionLines<=7&&(!payload.notes||noteLines<=2);
}

function receiptPaginateItems_(payload){
  const segments=receiptItemSegments_(payload.items||[]);
  const notesLines=payload.notes
    ?wrapFolderLabelPdfText_(normalizeFolderLabelPdfText_(payload.notes),495,7.5,false)
    :[];
  const footerHeight=128+(notesLines.length?18+notesLines.length*8.5:0);
  const normalCapacity=540;
  const finalCapacity=Math.max(145,540-footerHeight);
  const pages=[];
  let index=0;
  while(index<segments.length){
    const remaining=segments.slice(index);
    const remainingHeight=remaining.reduce((sum,row)=>sum+row.height,0);
    if(remainingHeight<=finalCapacity){
      pages.push({segments:remaining,isLast:true});
      index=segments.length;
      break;
    }
    let used=0;
    const pageSegments=[];
    const targetUse=Math.min(
      normalCapacity,
      Math.max(remainingHeight-finalCapacity,Math.min(normalCapacity,remainingHeight/2))
    );
    while(index<segments.length&&used+segments[index].height<=normalCapacity){
      pageSegments.push(segments[index]);
      used+=segments[index].height;
      index++;
      if(used>=targetUse)break;
    }
    if(!pageSegments.length){
      pageSegments.push(segments[index]);
      index++;
    }
    pages.push({segments:pageSegments,isLast:false});
  }
  if(!pages.length)pages.push({segments:[],isLast:true});
  if(!pages[pages.length-1].isLast){
    pages.push({segments:[],isLast:true});
  }
  return pages;
}

function receiptItemSegments_(items){
  const result=[];
  (items||[]).forEach((item,itemIndex)=>{
    const normalized=normalizeFolderLabelPdfText_(item.description||'');
    const lines=wrapFolderLabelPdfText_(normalized,285,7.4,false);
    const maxLines=48;
    for(let start=0;start<lines.length;start+=maxLines){
      const part=lines.slice(start,start+maxLines);
      result.push({
        number:item.number||itemIndex+1,
        continuation:start>0,
        lines:part,
        pageCount:item.pageCount,
        developmentLevel:item.developmentLevel,
        condition:item.condition,
        height:Math.max(21,part.length*8.2+8)
      });
    }
  });
  return result;
}

function receiptDrawHalfPage_(payload,pageWidth,pageHeight){
  const commands=[];
  commands.push('q 0.06 0.36 0.25 RG 0.8 w 36 420 m 559 420 l S Q');
  commands.push('q 0.76 0.56 0.22 RG 0.35 w [4 4] 0 d 36 410 m 559 410 l S Q');
  commands.push(receiptPdfTextCommand_('GUNTING DI GARIS INI',pageWidth/2,412,6,true,'CENTER',[.34,.34,.34]));
  commands.push(receiptDrawCompactCopy_(payload,'UNTUK PENYERAH',36,432,523,372));
  commands.push(receiptDrawCompactCopy_(payload,'UNTUK PENERIMA',36,27,523,372));
  return commands;
}

function receiptDrawCompactCopy_(payload,copyLabel,x,bottom,width,height){
  const commands=[];
  const top=bottom+height;
  commands.push(receiptPdfFillRect_(x,bottom,width,height,[.985,.99,.982]));
  commands.push(receiptPdfStrokeRect_(x,bottom,width,height,.95,[.06,.36,.25]));
  commands.push(receiptPdfStrokeRect_(x+4,bottom+4,width-8,height-8,.3,[.76,.56,.22]));
  if(payload.status==='DIBATALKAN')commands.push(receiptCancellationWatermark_(x+width/2,bottom+height/2,31));
  commands.push(receiptPdfFillRect_(x+1,top-6,width-2,5,[.06,.36,.25]));
  commands.push(receiptPdfFillRect_(x+5,top-53,width-10,46,[.94,.97,.95]));
  commands.push(receiptPdfFillRect_(x+width-15,top-53,10,46,[.76,.56,.22]));
  commands.push('q 35 0 0 35 '+pdfNumber_(x+11)+' '+pdfNumber_(top-47)+' cm /Im1 Do Q');
  commands.push(receiptPdfTextCommand_('TANDA TERIMA PENYERAHAN ARSIP',x+width/2,top-23,11,true,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_('UIN SUNAN AMPEL SURABAYA',x+width/2,top-36,6.3,true,'CENTER',[.33,.33,.33]));
  commands.push(receiptPdfTextCommand_('Nomor: '+normalizeFolderLabelPdfText_(payload.number),x+width/2,top-47,7.5,true,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(copyLabel,x+width-21,top-16,6.5,true,'RIGHT',[.04,.28,.20]));
  if(payload.isReprint)commands.push(receiptPdfTextCommand_('CETAK ULANG',x+width-21,top-29,7,true,'RIGHT',[.72,.08,.06]));
  commands.push(receiptPdfFillRect_(x+10,top-94,width-20,35,[.965,.98,.97]));
  commands.push(receiptPdfTextCommand_('Tanggal/Jam',x+16,top-67,7,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+receiptPdfTimestampText_(payload.receivedAt),x+87,top-67,7,false));
  commands.push(receiptPdfTextCommand_('Penyerah',x+16,top-79,7,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+normalizeFolderLabelPdfText_(payload.senderName)+' - '+
    normalizeFolderLabelPdfText_(payload.senderUnit),x+87,top-79,7,false));
  commands.push(receiptPdfTextCommand_('Penerima',x+16,top-91,7,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+normalizeFolderLabelPdfText_(payload.receiverName)+' - '+
    normalizeFolderLabelPdfText_(payload.receiverUnit),x+87,top-91,7,false));
  let y=top-106;
  commands.push(receiptDrawTableHeader_(x+10,y,width-20,16,true));
  y-=16;
  (payload.items||[]).forEach((item,index)=>{
    const lines=wrapFolderLabelPdfText_(normalizeFolderLabelPdfText_(item.description),275,7.2,false);
    const rowHeight=Math.max(19,lines.length*7.8+6);
    commands.push(receiptDrawTableRow_({
      number:item.number||index+1,continuation:false,lines:lines,
      pageCount:item.pageCount,developmentLevel:item.developmentLevel,condition:item.condition
    },x+10,y,width-20,rowHeight,true,index));
    y-=rowHeight;
  });
  const totalPages=(payload.items||[]).reduce((sum,item)=>sum+Number(item.pageCount||0),0);
  commands.push(receiptPdfTextCommand_(
    (payload.items||[]).length+' item | '+totalPages+' lembar',
    x+width-12,y-11,6.7,true,'RIGHT',[.04,.28,.20]
  ));
  y-=13;
  if(payload.notes){
    const noteLines=wrapFolderLabelPdfText_('Catatan: '+normalizeFolderLabelPdfText_(payload.notes),width-24,7,false);
    noteLines.slice(0,2).forEach((line,index)=>{
      commands.push(receiptPdfTextCommand_(line,x+12,y-8-index*8,7,false));
    });
    y-=Math.min(2,noteLines.length)*8+7;
  }
  const statement='Arsip fisik tersebut telah diserahkan dan diterima sesuai daftar di atas.';
  commands.push(receiptPdfFillRect_(x+10,y-18,width-20,18,[.985,.965,.91]));
  commands.push(receiptPdfTextCommand_(statement,x+width/2,y-12,6.7,false,'CENTER',[.26,.23,.16]));
  const signatureY=bottom+35;
  commands.push(receiptPdfTextCommand_('Yang Menyerahkan,',x+95,signatureY+44,7.2,false,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_('Yang Menerima,',x+width-95,signatureY+44,7.2,false,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfLine_(x+48,signatureY+11,x+142,signatureY+11,.35,[.35,.35,.35]));
  commands.push(receiptPdfLine_(x+width-142,signatureY+11,x+width-48,signatureY+11,.35,[.35,.35,.35]));
  commands.push(receiptPdfTextCommand_('('+normalizeFolderLabelPdfText_(payload.senderName)+')',x+95,signatureY,7.2,true,'CENTER'));
  commands.push(receiptPdfTextCommand_('('+normalizeFolderLabelPdfText_(payload.receiverName)+')',x+width-95,signatureY,7.2,true,'CENTER'));
  return commands.join('\n');
}

function receiptDrawFullPage_(payload,page,pageWidth,pageHeight){
  const commands=[];
  const x=40;
  const width=515;
  const top=800;
  const bottom=42;
  commands.push(receiptPdfFillRect_(x,bottom,width,top-bottom,[.992,.994,.989]));
  commands.push(receiptPdfStrokeRect_(x,bottom,width,top-bottom,1.05,[.06,.36,.25]));
  commands.push(receiptPdfStrokeRect_(x+4,bottom+4,width-8,top-bottom-8,.35,[.76,.56,.22]));
  if(payload.status==='DIBATALKAN')commands.push(receiptCancellationWatermark_(pageWidth/2,pageHeight/2,56));
  commands.push(receiptPdfFillRect_(x+1,top-8,width-2,7,[.06,.36,.25]));
  commands.push(receiptPdfFillRect_(x+5,top-68,width-10,57,[.94,.97,.95]));
  commands.push(receiptPdfFillRect_(x+width-18,top-68,13,57,[.76,.56,.22]));
  commands.push('q 44 0 0 44 '+(x+12)+' '+(top-58)+' cm /Im1 Do Q');
  commands.push(receiptPdfTextCommand_('TANDA TERIMA PENYERAHAN ARSIP',pageWidth/2,top-27,15,true,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_('UNIVERSITAS ISLAM NEGERI SUNAN AMPEL SURABAYA',pageWidth/2,top-42,7.2,true,'CENTER',[.32,.32,.32]));
  commands.push(receiptPdfTextCommand_('Nomor: '+normalizeFolderLabelPdfText_(payload.number),pageWidth/2,top-57,9.2,true,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(page.copyLabel,x+width-24,top-20,7,true,'RIGHT',[.04,.28,.20]));
  if(payload.isReprint)commands.push(receiptPdfTextCommand_('CETAK ULANG - KE-'+payload.printNumber,x+width-24,top-35,8,true,'RIGHT',[.72,.08,.06]));
  commands.push(receiptPdfTextCommand_('Halaman '+page.copyPage+' dari '+page.copyPageCount,x+width-24,top-51,7,false,'RIGHT',[.35,.35,.35]));
  commands.push(receiptPdfFillRect_(x+10,top-128,width-20,51,[.965,.98,.97]));
  commands.push(receiptPdfLine_(x+143,top-124,x+143,top-81,.35,[.74,.82,.77]));
  commands.push(receiptPdfTextCommand_('Tanggal dan jam penerimaan',x+17,top-87,8,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+receiptPdfTimestampText_(payload.receivedAt),x+153,top-87,8,false));
  commands.push(receiptPdfTextCommand_('Pegawai penyerah',x+17,top-99,8,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+normalizeFolderLabelPdfText_(payload.senderName)+' - '+
    normalizeFolderLabelPdfText_(payload.senderUnit),x+153,top-99,8,false));
  commands.push(receiptPdfTextCommand_('Penerima arsip',x+17,top-111,8,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+normalizeFolderLabelPdfText_(payload.receiverName)+' - '+
    normalizeFolderLabelPdfText_(payload.receiverUnit),x+153,top-111,8,false));
  commands.push(receiptPdfTextCommand_('Lokasi',x+17,top-123,8,true,false,[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_(': '+normalizeFolderLabelPdfText_(payload.location||'Surabaya'),x+153,top-123,8,false));
  let y=top-137;
  commands.push(receiptDrawTableHeader_(x,y,width,20,false));
  y-=20;
  (page.segments||[]).forEach((segment,index)=>{
    commands.push(receiptDrawTableRow_(segment,x,y,width,segment.height,false,index));
    y-=segment.height;
  });
  if(!page.isLast){
    commands.push(receiptPdfTextCommand_('Daftar item berlanjut pada halaman berikutnya.',x+width/2,bottom+17,7.5,true,'CENTER',[.04,.28,.20]));
    return commands;
  }
  const totalPages=(payload.items||[]).reduce((sum,item)=>sum+Number(item.pageCount||0),0);
  commands.push(receiptPdfTextCommand_(
    (payload.items||[]).length+' item arsip | '+totalPages+' lembar',
    x+width,y-12,7.3,true,'RIGHT',[.04,.28,.20]
  ));
  y-=14;
  if(payload.notes){
    y-=9;
    commands.push(receiptPdfTextCommand_('Catatan:',x+10,y,8,true,false,[.04,.28,.20]));
    y-=11;
    const lines=wrapFolderLabelPdfText_(normalizeFolderLabelPdfText_(payload.notes),width-20,7.5,false);
    lines.forEach(line=>{
      commands.push(receiptPdfTextCommand_(line,x+10,y,7.5,false));
      y-=8.5;
    });
  }
  y-=10;
  const statement='Dengan ini kedua pihak menyatakan bahwa arsip fisik tersebut telah diserahkan dan diterima sesuai daftar di atas.';
  const statementLines=wrapFolderLabelPdfText_(statement,width-20,8,false);
  const statementHeight=statementLines.length*10+12;
  commands.push(receiptPdfFillRect_(x,y-statementHeight+4,width,statementHeight,[.985,.965,.91]));
  statementLines.forEach(line=>{
    commands.push(receiptPdfTextCommand_(line,x+10,y-7,8,false,false,[.25,.22,.15]));
    y-=10;
  });
  if(payload.status==='DIBATALKAN'&&payload.cancellationReason){
    y-=10;
    const cancellation='Dibatalkan: '+normalizeFolderLabelPdfText_(payload.cancellationReason);
    const cancellationLines=wrapFolderLabelPdfText_(cancellation,width-20,7,false).slice(0,3);
    const cancellationHeight=cancellationLines.length*9+10;
    commands.push(receiptPdfFillRect_(x,y-cancellationHeight+4,width,cancellationHeight,[.995,.93,.92]));
    cancellationLines.forEach(line=>{
      commands.push(receiptPdfTextCommand_(line,x+10,y-7,7,true,false,[.72,.08,.06]));
      y-=9;
    });
  }
  const signatureTop=Math.min(y-11,151);
  commands.push(receiptPdfTextCommand_('Yang Menyerahkan,',x+110,signatureTop,8,false,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfTextCommand_('Yang Menerima,',x+width-110,signatureTop,8,false,'CENTER',[.04,.28,.20]));
  commands.push(receiptPdfLine_(x+57,87,x+163,87,.4,[.35,.35,.35]));
  commands.push(receiptPdfLine_(x+width-163,87,x+width-57,87,.4,[.35,.35,.35]));
  commands.push(receiptPdfTextCommand_('('+normalizeFolderLabelPdfText_(payload.senderName)+')',x+110,74,8.5,true,'CENTER'));
  commands.push(receiptPdfTextCommand_('('+normalizeFolderLabelPdfText_(payload.receiverName)+')',x+width-110,74,8.5,true,'CENTER'));
  return commands;
}

function receiptDrawTableHeader_(x,top,width,height,compact){
  const columns=receiptTableColumns_(x,width,compact);
  const commands=['q 0.06 0.36 0.25 rg '+pdfNumber_(x)+' '+pdfNumber_(top-height)+' '+
    pdfNumber_(width)+' '+pdfNumber_(height)+' re f Q'];
  commands.push(receiptPdfRectLines_(x,top,width,height,columns));
  const fontSize=compact?6.5:7.2;
  const white=[1,1,1];
  commands.push(receiptPdfTextCommand_('No.',columns[0].center,top-height+5,fontSize,true,'CENTER',white));
  commands.push(receiptPdfTextCommand_('Uraian Informasi Arsip',columns[1].center,top-height+5,fontSize,true,'CENTER',white));
  commands.push(receiptPdfTextCommand_('Hal.',columns[2].center,top-height+5,fontSize,true,'CENTER',white));
  commands.push(receiptPdfTextCommand_('Tingkat',columns[3].center,top-height+5,fontSize,true,'CENTER',white));
  commands.push(receiptPdfTextCommand_('Kondisi',columns[4].center,top-height+5,fontSize,true,'CENTER',white));
  return commands.join('\n');
}

function receiptDrawTableRow_(segment,x,top,width,height,compact,rowIndex){
  const columns=receiptTableColumns_(x,width,compact);
  const commands=[];
  if(Number(rowIndex)%2===1){
    commands.push(receiptPdfFillRect_(x,top-height,width,height,[.955,.975,.963]));
  }
  commands.push(receiptPdfRectLines_(x,top,width,height,columns));
  const fontSize=compact?7.2:7.4;
  const numberText=String(segment.number)+(segment.continuation?' (lanj.)':'');
  commands.push(receiptPdfTextCommand_(numberText,columns[0].center,top-12,fontSize,false,'CENTER'));
  (segment.lines||[]).forEach((line,index)=>{
    commands.push(receiptPdfTextCommand_(line,columns[1].left+4,top-11-index*(compact?7.8:8.2),fontSize,false));
  });
  commands.push(receiptPdfTextCommand_(String(segment.pageCount||''),columns[2].center,top-12,fontSize,false,'CENTER'));
  commands.push(receiptPdfTextCommand_(normalizeFolderLabelPdfText_(segment.developmentLevel||''),columns[3].center,top-12,fontSize,false,'CENTER'));
  const condition=receiptPrintTitleCase_(segment.condition||'');
  const conditionLines=wrapFolderLabelPdfText_(condition,columns[4].width-5,fontSize,false);
  conditionLines.forEach((line,index)=>{
    commands.push(receiptPdfTextCommand_(line,columns[4].center,top-12-index*8,fontSize,false,'CENTER'));
  });
  return commands.join('\n');
}

function receiptTableColumns_(x,width,compact){
  const ratios=compact?[.07,.56,.09,.12,.16]:[.07,.56,.09,.13,.15];
  let cursor=x;
  return ratios.map(ratio=>{
    const columnWidth=width*ratio;
    const result={left:cursor,width:columnWidth,center:cursor+columnWidth/2};
    cursor+=columnWidth;
    return result;
  });
}

function receiptPdfRectLines_(x,top,width,height,columns){
  const lines=['q 0.10 0.30 0.23 RG 0.45 w '+pdfNumber_(x)+' '+pdfNumber_(top-height)+' '+
    pdfNumber_(width)+' '+pdfNumber_(height)+' re S'];
  columns.slice(0,-1).forEach(column=>{
    const boundary=column.left+column.width;
    lines.push(pdfNumber_(boundary)+' '+pdfNumber_(top)+' m '+pdfNumber_(boundary)+' '+
      pdfNumber_(top-height)+' l S');
  });
  lines.push('Q');
  return lines.join('\n');
}

function receiptPdfFillRect_(x,y,width,height,color){
  return 'q '+(color||[1,1,1]).map(pdfNumber_).join(' ')+' rg '+
    [x,y,width,height].map(pdfNumber_).join(' ')+' re f Q';
}

function receiptPdfStrokeRect_(x,y,width,height,lineWidth,color){
  return 'q '+(color||[0,0,0]).map(pdfNumber_).join(' ')+' RG '+
    pdfNumber_(lineWidth||.5)+' w '+[x,y,width,height].map(pdfNumber_).join(' ')+' re S Q';
}

function receiptPdfLine_(x1,y1,x2,y2,lineWidth,color){
  return 'q '+(color||[0,0,0]).map(pdfNumber_).join(' ')+' RG '+
    pdfNumber_(lineWidth||.5)+' w '+pdfNumber_(x1)+' '+pdfNumber_(y1)+' m '+
    pdfNumber_(x2)+' '+pdfNumber_(y2)+' l S Q';
}

function receiptPdfTextCommand_(text,x,y,fontSize,bold,align,color){
  const normalized=normalizeFolderLabelPdfText_(text);
  const width=measureFolderLabelPdfText_(normalized,fontSize,Boolean(bold));
  let drawX=x;
  if(align==='CENTER')drawX=x-width/2;
  if(align==='RIGHT')drawX=x-width;
  const rgb=color||[0,0,0];
  return 'q '+rgb.map(pdfNumber_).join(' ')+' rg BT /F'+(bold?'2':'1')+' '+
    pdfNumber_(fontSize)+' Tf '+pdfNumber_(drawX)+' '+pdfNumber_(y)+
    ' Td ('+pdfEscapeText_(normalized)+') Tj ET Q';
}

function receiptCancellationWatermark_(x,y,fontSize){
  const text='DIBATALKAN';
  const width=measureFolderLabelPdfText_(text,fontSize,true);
  return 'q 0.92 0.72 0.72 rg BT /F2 '+pdfNumber_(fontSize)+' Tf '+
    '0.707 0.707 -0.707 0.707 '+pdfNumber_(x-width*.35)+' '+pdfNumber_(y-width*.35)+
    ' Tm ('+text+') Tj ET Q';
}

function receiptPdfTimestampText_(value){
  const date=new Date(value);
  if(isNaN(date))return normalizeFolderLabelPdfText_(value||'');
  const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const formatter=new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',hour12:false
  });
  const parts={};
  formatter.formatToParts(date).forEach(part=>parts[part.type]=part.value);
  return Number(parts.day)+' '+months[Number(parts.month)-1]+' '+parts.year+
    ', '+parts.hour+'.'+parts.minute+' WIB';
}

function receiptPrintTitleCase_(value){
  return String(value||'').toLowerCase().replace(/\b\w/g,character=>character.toUpperCase());
}
</script>
