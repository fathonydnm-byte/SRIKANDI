async function saveItemDirect(event){
  event.preventDefault();
  try{validateBeforeSave()}catch(error){toast(error.message,true);return}
  const button=$('saveItem');
  const savingWithoutPdf=!$('pdfFile').files[0];
  button.disabled=true;
  button.textContent='Menyimpan…';
  if(savingWithoutPdf)showItemSavingOverlay();
  try{
    updateClassificationId();
    const mode=$('berkasMode').value;
    if(mode==='NEW'&&!$('newBerkasId').value)$('newBerkasId').value=newClientId('BRK');
    $('previewItemId').value=newClientId('ITM');
    $('previewCreatedAt').value='';
    const pdfFile=$('pdfFile').files[0];
    const queuedMetadata=formPayloadWithoutFiles($('archiveForm'));
    const berkasId=mode==='NEW'?$('newBerkasId').value:(state.lockedBerkasId||$('itemBerkasId').value);
    const selected=state.bootstrap.berkasOptions.find(row=>row.id===berkasId);
    const label=mode==='NEW'?$('title').value:(selected?selected.label:state.lockedBerkasLabel);
    if(!pdfFile){
      $('formStatus').textContent='Menyimpan metadata tanpa PDF…';
      const result=await runServer('apiCommitItemMetadata',queuedMetadata);
      clearItemOnly(false);
      resetNewBerkasFields();
      lockBerkas(result.berkasId,label);
      button.disabled=false;
      button.textContent='Simpan Item';
      const duration=result.durationMs?Math.max(.1,result.durationMs/1000).toFixed(1)+' detik':'';
      $('formStatus').textContent='Tersimpan tanpa PDF: '+result.itemId+(duration?' · '+duration:'');
      state.mediaOptions=null;
      state.editOptions=null;
      toast(result.message);
      loadBootstrap(result.berkasId).then(()=>{
        if(state.lockedBerkasId===result.berkasId)lockBerkas(result.berkasId,label);
      });
      return;
    }
    queuedMetadata.pdfName=pdfFile.name;
    queuedMetadata.pdfSize=pdfFile.size;
    queuedMetadata.pdfType=pdfFile.type||'application/pdf';
    state.pendingUpload={metadata:queuedMetadata,file:pdfFile,berkasId,label,running:true,sessionId:'',uploadedBytes:0,chunkSize:512*1024};
    lockBerkas(berkasId,label);
    clearItemOnly(false);
    resetNewBerkasFields();
    setUploadState('running','PDF item sebelumnya sedang diunggah. Anda dapat mengetik item berikutnya; jangan tutup halaman.');
    sendPendingUpload();
  }catch(error){
    button.disabled=false;
    button.textContent='Simpan Item';
    toast('Item belum dapat disimpan: '+error.message,true);
    $('formStatus').textContent='Penyimpanan belum berhasil.';
  }finally{
    if(savingWithoutPdf)hideItemSavingOverlay();
  }
}

function fileSliceToBase64(blob){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const value=String(reader.result||'');
      resolve(value.includes(',')?value.substring(value.indexOf(',')+1):value);
    };
    reader.onerror=()=>reject(new Error('Potongan PDF tidak dapat dibaca oleh browser.'));
    reader.readAsDataURL(blob);
  });
}

async function sendPendingUpload(){
  const upload=state.pendingUpload;
  if(!upload||upload.running!==true)return;
  try{
    if(!upload.sessionId){
      const started=await runServer('apiStartItemUpload',upload.metadata);
      upload.sessionId=started.sessionId;
      upload.chunkSize=started.chunkSize||upload.chunkSize;
      upload.uploadedBytes=started.uploadedBytes||0;
    }else{
      const status=await runServer('apiGetItemUploadStatus',upload.sessionId);
      if(status.committed&&status.result){
        await finishPendingUpload(upload,status.result);
        return;
      }
      upload.uploadedBytes=status.uploadedBytes||0;
    }

    while(upload.uploadedBytes<upload.file.size){
      const start=upload.uploadedBytes;
      const end=Math.min(start+upload.chunkSize,upload.file.size);
      const base64=await fileSliceToBase64(upload.file.slice(start,end,'application/pdf'));
      const progress=await runServer('apiUploadItemChunk',{
        sessionId:upload.sessionId,
        start:start,
        end:end,
        total:upload.file.size,
        base64:base64
      });
      if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan PDF. Klik Coba Upload Lagi.');
      upload.uploadedBytes=Number(progress.uploadedBytes);
      const percent=Math.min(100,Math.floor(upload.uploadedBytes/upload.file.size*100));
      setUploadState('running','Mengunggah PDF item sebelumnya: '+percent+'%. Anda dapat mengetik item berikutnya; jangan tutup halaman.');
    }

    setUploadState('running','PDF sudah lengkap. Menyimpan metadata dan memperbarui nomor definitif…');
    const result=await runServer('apiFinalizeItemUpload',upload.sessionId);
    await finishPendingUpload(upload,result);
  }catch(error){
    const message=error.message||String(error);
    if(/UPLOAD_SESSION_(EXPIRED|NOT_FOUND)/.test(message)){
      upload.sessionId='';
      upload.uploadedBytes=0;
    }
    upload.running=false;
    setUploadState('error','Upload item sebelumnya terhenti: '+message);
    $('formStatus').textContent='Item berikutnya ditahan sampai upload sebelumnya berhasil.';
    toast(message,true);
  }
}

async function finishPendingUpload(upload,result){
  state.pendingUpload=null;
  state.mediaOptions=null;
  state.editOptions=null;
  await loadBootstrap(result.berkasId);
  lockBerkas(result.berkasId,upload.label);
  setUploadState('success','Item sebelumnya berhasil disimpan. Anda dapat menyimpan item berikutnya.');
  $('formStatus').textContent='Tersimpan: '+result.itemId;
  toast(result.message);
  setTimeout(()=>{if(!state.pendingUpload)$('uploadBanner').hidden=true},5000);
}

function retryPendingUpload(){
  if(!state.pendingUpload||state.pendingUpload.running)return;
  state.pendingUpload.running=true;
  setUploadState('running','Mencoba mengunggah kembali item sebelumnya…');
  sendPendingUpload();
}

let masterLogLoadedOnce_=false;
async function loadMasterLog(forceReload){
  if(masterLogLoadedOnce_&&!forceReload)return;
  $('masterLogLocked').hidden=true;
  $('masterLogTableWrap').hidden=true;
  $('refreshMasterLog').hidden=true;
  $('masterLogEmpty').hidden=false;
  $('masterLogEmpty').textContent='Memuat jejak audit…';
  $('masterLogSubtitle').textContent='Memeriksa hak akses…';
  try{
    const response=await runServer('apiGetMasterLog',200);
    masterLogLoadedOnce_=true;
    if(!response.authorized){
      $('masterLogEmpty').hidden=true;
      $('masterLogLocked').hidden=false;
      $('masterLogDeniedMessage').textContent=response.message||'Hanya administrator unit yang dapat membuka Master Log Perubahan.';
      $('masterLogSubtitle').textContent='Akses ditolak.';
      return;
    }
    $('refreshMasterLog').hidden=false;
    $('masterLogSubtitle').textContent='Jejak audit permanen seluruh aktivitas petugas arsiparis.';
    const rows=response.rows||[];
    $('masterLogEmpty').hidden=rows.length>0;
    $('masterLogTableWrap').hidden=rows.length===0;
    if(!rows.length){
      $('masterLogEmpty').textContent='Belum ada aktivitas tercatat.';
      return;
    }
    $('masterLogResultsBody').innerHTML=rows.map(renderMasterLogRow_).join('');
  }catch(error){
    masterLogLoadedOnce_=false;
    $('masterLogEmpty').hidden=false;
    $('masterLogEmpty').textContent='Gagal memuat Master Log: '+error.message;
    $('masterLogSubtitle').textContent='Terjadi kesalahan.';

  }

function renderMasterLogRow_(row){
  const statusClass=String(row.status||'').toUpperCase()==='BERHASIL'?'success':(String(row.status||'').toUpperCase()==='GAGAL'?'danger':'warning');
  return '<tr>'+
    '<td>'+escapeHtml(row.timestamp||'–')+'</td>'+

    '<td>'+escapeHtml(row.modul||'–')+'</td>'+
    '<td>'+escapeHtml(row.jenisObjek||'–')+(row.objekId?' <span class="search-cell-sub">'+escapeHtml(row.objekId)+'</span>':'')+'</td>'+
    '<td><span class="status-badge '+statusClass+'">'+escapeHtml(row.aksi||'–')+'</span></td>'+
    '<td><div class="search-description">'+escapeHtml(row.ringkasan||'–')+'</div>'+(row.alasan?'<span class="search-cell-sub">Alasan: '+escapeHtml(row.alasan)+'</span>':'')+'</td>'+
  '</tr>';
}

/* ===== Spotlight Search (Ctrl+K, terhubung ke pencarian arsip asli) ===== */
let spotlightDebounceTimer_=null;
function bindSpotlightSearch(){
  document.addEventListener('keydown',event=>{
    if((event.ctrlKey||event.metaKey)&&String(event.key).toLowerCase()==='k'){
      event.preventDefault();
      openSpotlightSearch();
      return;
    }
    if(event.key==='Escape'){
      if($('archiveDetailModal').classList.contains('open')){closeArchiveDetail_();return}
      if($('spotlightModal').classList.contains('open'))closeSpotlightSearch();
    }
  });
  $('spotlightModal').addEventListener('click',event=>{
    if(event.target===$('spotlightModal'))closeSpotlightSearch();
  });
  $('spotlightInput').addEventListener('input',()=>{
    clearTimeout(spotlightDebounceTimer_);
    spotlightDebounceTimer_=setTimeout(runSpotlightSearch_,300);
  });
  $('spotlightResults').addEventListener('click',event=>{
    const seeAll=event.target.closest('[data-spotlight-see-all]');
    if(seeAll){
      const query=state.spotlightQuery;
      closeSpotlightSearch();
      showPage('search');
      $('searchQuery').value=query;
      $('searchForm').requestSubmit();
      return;
    }
    const row=event.target.closest('[data-item-id]');
    if(!row)return;
    const item=state.spotlightResults.find(candidate=>candidate.itemId===row.dataset.itemId);
    if(!item)return;
    closeSpotlightSearch();
    openArchiveDetail_(item);
  });
  $('closeArchiveDetail').addEventListener('click',closeArchiveDetail_);
  $('archiveDetailModal').addEventListener('click',event=>{
    if(event.target===$('archiveDetailModal'))closeArchiveDetail_();
  });
}

function openSpotlightSearch(){
  $('spotlightModal').classList.add('open');
  $('spotlightInput').value='';
  $('spotlightInput').focus();
  state.spotlightResults=[];
  state.spotlightQuery='';
  $('spotlightResults').innerHTML='<div class="spotlight-empty">Ketik minimal 2 huruf untuk mulai mencari.</div>';
}

function closeSpotlightSearch(){
  $('spotlightModal').classList.remove('open');
  clearTimeout(spotlightDebounceTimer_);
}

async function runSpotlightSearch_(){
  const query=$('spotlightInput').value.trim();
  state.spotlightQuery=query;
  if(query.length<2){
    state.spotlightResults=[];
    $('spotlightResults').innerHTML='<div class="spotlight-empty">Ketik minimal 2 huruf untuk mulai mencari.</div>';
    return;
  }
  $('spotlightResults').innerHTML='<div class="spotlight-empty">Mencari…</div>';
  try{
    const response=await runServer('apiSearchArchive',{query,limit:8});
    const rows=response&&response.results||[];
    state.spotlightResults=rows;
    if(!rows.length){
      $('spotlightResults').innerHTML='<div class="spotlight-empty">Tidak ada arsip aktif yang cocok dengan "'+escapeHtml(query)+'".</div>';
      return;
    }
    $('spotlightResults').innerHTML=rows.map(renderSpotlightRow_).join('')+
      '<div class="spotlight-row spotlight-see-all" data-spotlight-see-all><span class="spotlight-label-inline">Lihat semua hasil di halaman Pencarian Arsip →</span></div>';
  }catch(error){
    state.spotlightResults=[];
    $('spotlightResults').innerHTML='<div class="spotlight-empty">Pencarian gagal: '+escapeHtml(error.message)+'</div>';
  }
}

function renderSpotlightRow_(row){
  return '<div class="spotlight-row" data-item-id="'+escapeHtml(row.itemId)+'">'+
    '<div><strong>'+escapeHtml(row.berkasNumber)+' / '+escapeHtml(row.itemNumber)+'</strong>'+
    '<span class="spotlight-sub">'+escapeHtml(row.description)+'</span></div>'+
    '<span class="spotlight-sub">'+escapeHtml(row.letterNumber||'Tanpa nomor surat')+'</span>'+
  '</div>';
}

/* ===== Detail Arsip (dibuka dari Spotlight Search) ===== */
function openArchiveDetail_(row){
  $('archiveDetailTitle').textContent=(row.berkasNumber||'–')+' / '+(row.itemNumber||'–');
  $('archiveDetailSubtitle').textContent=row.title||'Tanpa judul berkas';
  $('archiveDetailDescription').textContent=row.description||'Tidak ada uraian.';
  $('archiveDetailLetterNumber').textContent=row.letterNumber||'Tanpa nomor surat';
  $('archiveDetailDate').textContent=formatArchiveDate(row.documentDate);
  $('archiveDetailDevelopment').textContent=row.developmentLevel||'–';
  $('archiveDetailPageCount').textContent=(row.pageCount||0)+' lembar';
  $('archiveDetailCondition').textContent=row.condition?receiptTitleCase_(row.condition):'Tidak dicatat';
  $('archiveDetailClassification').textContent=row.classificationCode||'–';
  $('archiveDetailLocation').textContent=row.location||'–';
  $('archiveDetailBerkasTitle').textContent=row.title||'–';

  const fileBadge=row.fileStatus==='TERSEDIA'
    ? '<span class="status-badge success">PDF tersedia</span>'
    : '<span class="status-badge warning">Belum diunggah</span>';
  const loanBadge=String(row.loanStatus||'TERSEDIA').toUpperCase()==='TERSEDIA'
    ? '<span class="status-badge">Tersedia dipinjam</span>'
    : '<span class="status-badge loan">'+escapeHtml(row.loanStatus)+'</span>';
  $('archiveDetailBadges').innerHTML=fileBadge+loanBadge;

  const fileLink=$('archiveDetailFileLink');
  if(row.fileUrl){
    fileLink.href=row.fileUrl;
    fileLink.classList.remove('disabled');
    fileLink.textContent='Buka PDF Alih Media';
  }else{
    fileLink.href='#';
    fileLink.classList.add('disabled');
    fileLink.textContent='PDF Belum Diunggah';
  }
  const folderLink=$('archiveDetailFolderLink');
  if(row.folderUrl){
    folderLink.href=row.folderUrl;
    folderLink.classList.remove('disabled');
  }else{
    folderLink.href='#';
    folderLink.classList.add('disabled');
  }

  $('archiveDetailModal').classList.add('open');
}

function closeArchiveDetail_(){
  $('archiveDetailModal').classList.remove('open');
}
</script>
