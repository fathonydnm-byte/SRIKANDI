<script>
const state={bootstrap:null,bootstrapRequestId:0,pendingUpload:null,lockedBerkasId:'',lockedBerkasLabel:'',deletionOptions:null,editOptions:null,deletionUpload:null,editUpload:null,mediaOptions:null,mediaUpload:null,searchResults:null,labelOptions:null,selectedLabelIds:new Set(),retentionOptions:null,selectedRetentionIds:new Set(),transferSubmissionUpload:null,loanOptions:null,loanOptionsPromise:null,loanUpload:null,selectedLoanItemIds:new Set(),selectedReturnLoanId:'',receiptOptions:null,receiptUpload:null,receiptCancelUpload:null,receiptItemSequence:0,receiptSaveRequestId:'',receiptFilingOptions:null,selectedReceiptItemIds:new Set(),receiptFilingRequestId:'',inputSourceMode:'RECEIPT',spotlightResults:[],spotlightQuery:''};
const ARCHIVE_MEDIA_MAX_BYTES=100*1024*1024;
const $=id=>document.getElementById(id);
let loadingStageTimers=[];

document.addEventListener('DOMContentLoaded',()=>{
  bindNavigation();
  bindReceiptPage();
  bindArchiveForm();
  bindMediaForm();
  bindSearchForm();
  bindFolderLabelPage();
  bindRetentionPage();
  bindLoanPage();
  bindEditForm();
  bindDeletionForm();
  bindMasterLogPage();
  bindSpotlightSearch();
  bindNavDropdown();
  loadBootstrap();
});

function runServer(name,...args){
  return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(error=>reject(new Error(error.message||error)))[name](...args));
}

function runServerWithTimeout_(timeoutMs,name,...args){
  let timer;
  const timeout=new Promise((resolve,reject)=>{
    timer=setTimeout(()=>{
      const error=new Error('Server belum memberikan respons dalam batas waktu.');
      error.code='SERVER_TIMEOUT';
      reject(error);
    },Math.max(1000,Number(timeoutMs)||45000));
  });
  return Promise.race([runServer(name,...args),timeout]).finally(()=>clearTimeout(timer));
}

function newReceiptRequestId_(){
  return 'RCV-'+Date.now().toString(36).toUpperCase()+'-'+
    Math.random().toString(36).slice(2,10).toUpperCase();
}

function formPayloadWithoutFiles(form){
  const payload={};
  for(const [name,value] of new FormData(form).entries()){
    if(value instanceof File)continue;
    payload[name]=value;
  }
  return payload;
}

async function loadBootstrap(preferredBerkasId){
  const requestId=++state.bootstrapRequestId;
  const retentionOptionsAtStart=state.retentionOptions;
  const loanOptionsAtStart=state.loanOptions;
  try{
    const bootstrap=await runServer('apiGetBootstrap');
    if(requestId!==state.bootstrapRequestId)return;
    state.bootstrap=bootstrap;
    // Jangan menghapus data modul yang selesai dimuat ketika bootstrap masih berjalan.
    // Ini mencegah tabel Peminjaman tetap terlihat tetapi state dropdown/tindakannya kosong.
    if(state.retentionOptions===retentionOptionsAtStart)state.retentionOptions=null;
    if(state.loanOptions===loanOptionsAtStart){
      if(state.loanOptions&&$('loansPage').classList.contains('active')){
        loadLoanOptions(true,true,true)
          .catch(error=>toast('Data Peminjaman gagal disegarkan: '+error.message,true));
      }else{
        state.loanOptions=null;
      }
    }
    $('userBadge').textContent=state.bootstrap.user;
    if($('userBadgeTop'))$('userBadgeTop').textContent=state.bootstrap.user;
    if($('userAvatar')){
      const initialsSource=String(state.bootstrap.user||'?').trim();
      $('userAvatar').textContent=initialsSource?initialsSource.charAt(0).toUpperCase():'?';
    }
    if($('instanceUnitName')){
      const instance=state.bootstrap.instance||{};
      $('instanceUnitName').textContent=instance.unitName||instance.unitCode||'UINSA';
      $('instanceUnitName').title='Rilis '+(instance.releaseVersion||'–')+' · Instance '+(instance.instanceId||'–');
    }
    renderDashboard();
    renderClassification('ROOT','primaryClass');
    renderBerkasOptions(preferredBerkasId||state.lockedBerkasId);
  }catch(e){toast(e.message,true)}
}

function renderDashboard(){
  const d=state.bootstrap.dashboard;
  $('statBerkas').textContent=d.totalBerkas;
  $('statItem').textContent=d.totalItems;
  $('statLoan').textContent=d.activeLoans;
  $('statDue').textContent=d.retentionDueSoon;
  $('statExpired').textContent=d.expiredRetention;
}

function renderBerkasOptions(preferredId){
  const select=$('itemBerkasId');
  select.innerHTML='<option value="">Pilih berkas induk</option>';
  state.bootstrap.berkasOptions.forEach(row=>select.add(new Option(row.label,row.id)));
  if(preferredId&&state.bootstrap.berkasOptions.some(row=>row.id===preferredId))select.value=preferredId;
  onBerkasChanged();
}

function renderClassification(parentId,selectId){
  const select=$(selectId);
  select.innerHTML='<option value="">Pilih</option>';
  const rows=(state.bootstrap.classificationsByParent[parentId]||[]);
  rows.forEach(row=>select.add(new Option(row.label,row.id)));
  select.disabled=rows.length===0;
  updateClassificationId();
}

function bindNavigation(){
  document.querySelectorAll('[data-page],[data-go]').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page||button.dataset.go)));
}

const NAV_GROUPS_={receipts:'Penciptaan Arsip',input:'Penciptaan Arsip',labels:'Penciptaan Arsip',edit:'Pemeliharaan Arsip',deletion:'Pemeliharaan Arsip',media:'Pemeliharaan Arsip'};
const NAV_SUBTABS_={receipts:'subNavTabsPenciptaan',input:'subNavTabsPenciptaan',labels:'subNavTabsPenciptaan',edit:'subNavTabsPemeliharaan',deletion:'subNavTabsPemeliharaan',media:'subNavTabsPemeliharaan'};
const NAV_DROPDOWN_PAGES_=['edit','deletion','media'];

function bindNavDropdown(){
  const toggle=$('navKelolaToggle');
  if(!toggle)return;
  toggle.addEventListener('click',()=>{
    const menu=$('navKelolaMenu');
    menu.hidden=!menu.hidden;
  });
}

function showPage(page){
  const titles={dashboard:['Dashboard','Ringkasan kondisi arsip Anda.'],receipts:['Penerimaan Arsip','Catat penyerahan fisik dan buat tanda terima secara otomatis.'],input:['Input Arsip','Buat berkas baru atau lanjutkan daftar isi berkas yang sudah ada.'],media:['Alih Media','Lengkapi PDF untuk item arsip yang sudah tersimpan.'],search:['Cari Arsip','Temukan arsip aktif dan akses alih medianya dengan cepat.'],labels:['Cetak Lidah Folder','Buat PDF label folder fisik dari nomor definitif terbaru.'],retention:['Usul Pemindahan','Pantau retensi aktif dan siapkan draft usul tanpa mengubah fase arsip.'],loans:['Peminjaman','Catat, pantau, dan selesaikan peminjaman berkas maupun item arsip.'],edit:['Edit Arsip','Perbaiki metadata dan file alih media item yang sudah tersimpan.'],deletion:['Koreksi & Pembatalan','Koreksi atau batalkan data arsip secara terkendali dan tercatat.'],masterlog:['Master Log Perubahan','Jejak audit permanen seluruh aktivitas petugas arsiparis.']};
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
  document.querySelectorAll('.sub-tab-btn').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
  $(page+'Page').classList.add('active');
  $('pageTitle').textContent=titles[page][0];
  $('pageSubtitle').textContent=titles[page][1];
  if($('pageTitleCrumb'))$('pageTitleCrumb').textContent=titles[page][0];
  if($('crumbGroup'))$('crumbGroup').textContent=NAV_GROUPS_[page]||'Central File';
  Object.keys(NAV_SUBTABS_).forEach(key=>{
    const wrapId=NAV_SUBTABS_[key];
    if($(wrapId))$(wrapId).hidden=true;
  });
  const activeSubtabWrap=NAV_SUBTABS_[page];
  if(activeSubtabWrap&&$(activeSubtabWrap))$(activeSubtabWrap).hidden=false;
  if($('navKelolaToggle')){
    const isKelolaActive=NAV_DROPDOWN_PAGES_.indexOf(page)!==-1;
    $('navKelolaToggle').classList.toggle('active',isKelolaActive);
    if(isKelolaActive)$('navKelolaMenu').hidden=false;
  }
  if(page==='receipts')loadReceiptOptions();
  if(page==='input')loadReceiptFilingOptions();
  if(page==='media')loadMediaOptions();
  if(page==='labels')loadFolderLabelOptions();
  if(page==='retention')loadRetentionOptions();
  if(page==='loans')loadLoanOptions();
  if(page==='edit')loadEditOptions();
  if(page==='deletion')loadDeletionOptions();
  if(page==='masterlog')loadMasterLog();
}

function bindReceiptPage(){
  $('receiptSenderEmployee').addEventListener('change',renderReceiptSenderInfo_);
  $('addReceiptItem').addEventListener('click',()=>addReceiptItemRow_());
  $('receiptItems').addEventListener('click',event=>{
    const button=event.target.closest('[data-remove-receipt-item]');
    if(button)removeReceiptItemRow_(button.dataset.removeReceiptItem);
  });
  $('receiptItems').addEventListener('input',updateReceiptTotals_);
  $('receiptForm').addEventListener('submit',submitReceipt_);
  $('resetReceiptForm').addEventListener('click',()=>resetReceiptForm_(true));
  $('refreshReceipts').addEventListener('click',()=>loadReceiptOptions(true));
  $('receiptSearch').addEventListener('input',renderReceiptTable_);
  $('receiptStatusFilter').addEventListener('change',renderReceiptTable_);
  $('receiptResultsBody').addEventListener('click',event=>{
    const printButton=event.target.closest('[data-receipt-print]');
    if(printButton){printReceipt_(printButton.dataset.receiptPrint);return}
    const editButton=event.target.closest('[data-receipt-edit]');
    if(editButton){editReceipt_(editButton.dataset.receiptEdit);return}
    const evidenceButton=event.target.closest('[data-receipt-evidence]');
    if(evidenceButton){openReceiptEvidence_(evidenceButton.dataset.receiptEvidence);return}
    const cancelButton=event.target.closest('[data-receipt-cancel]');
    if(cancelButton)openReceiptCancel_(cancelButton.dataset.receiptCancel);
  });
  $('receiptEvidenceForm').addEventListener('submit',submitReceiptEvidence_);
  $('cancelReceiptEvidence').addEventListener('click',closeReceiptEvidence_);
  $('receiptCancelForm').addEventListener('submit',submitReceiptCancel_);
  $('closeReceiptCancel').addEventListener('click',closeReceiptCancel_);
  $('openEmployeeModal').addEventListener('click',openEmployeeModal_);
  $('closeEmployeeModal').addEventListener('click',closeEmployeeModal_);
  $('cancelEmployeeModal').addEventListener('click',closeEmployeeModal_);
  $('employeeForm').addEventListener('submit',submitReceiptEmployee_);
  addReceiptItemRow_();
}

async function loadReceiptOptions(force=false){
  if(state.receiptOptions&&!force){renderReceiptPage_();return}
  $('receiptTableEmpty').hidden=false;
  $('receiptTableEmpty').textContent='Memuat tanda terima dan Master Pegawai…';
  $('receiptTableWrap').hidden=true;
  $('refreshReceipts').disabled=true;
  try{
    state.receiptOptions=await runServer('apiGetReceiptOptions');
    renderReceiptPage_();
  }catch(error){
    $('receiptTableEmpty').textContent='Data Penerimaan Arsip gagal dimuat.';
    toast(error.message,true);
  }finally{
    $('refreshReceipts').disabled=false;
  }
}

function renderReceiptPage_(){
  if(!state.receiptOptions)return;
  const summary=state.receiptOptions.summary||{};
  $('receiptStatTotal').textContent=summary.total||0;
  $('receiptStatActive').textContent=summary.active||0;
  $('receiptStatEvidence').textContent=summary.withEvidence||0;
  $('receiptStatCancelled').textContent=summary.cancelled||0;
  renderReceiptEmployees_();
  if(!$('receiptId').value){
    const defaults=state.receiptOptions.defaults||{};
    if(!$('receiptReceiverName').value)$('receiptReceiverName').value=defaults.receiverName||'';
    if(!$('receiptReceiverUnit').value)$('receiptReceiverUnit').value=defaults.receiverUnit||'';
  }
  renderReceiptSenderInfo_();
  renderReceiptTable_();
}

function renderReceiptEmployees_(preferredId){
  const select=$('receiptSenderEmployee');
  const previous=preferredId||select.value;
  select.innerHTML='<option value="">Pilih pegawai penyerah</option>';
  (state.receiptOptions&&state.receiptOptions.employees||[]).forEach(row=>
    select.add(new Option(row.label,row.id))
  );
  if(previous&&(state.receiptOptions.employees||[]).some(row=>row.id===previous))select.value=previous;
}

function renderReceiptSenderInfo_(){
  const employee=(state.receiptOptions&&state.receiptOptions.employees||[])
    .find(row=>row.id===$('receiptSenderEmployee').value);
  $('receiptSenderInfo').innerHTML=employee
    ? '<strong>'+escapeHtml(employee.name)+'</strong><br>'+escapeHtml(employee.unit)
    : 'Pilih pegawai yang menyerahkan arsip.';
}

  const row=document.createElement('article');
  row.className='receipt-item-row';
  row.dataset.receiptItem=String(sequence);
  row.dataset.receiptItemId=item&&item.id||'';
  row.dataset.archiveId=item&&item.archiveId||'';
  row.dataset.filingStatus=item&&item.filingStatus||'';
  row.dataset.removable='true';
  row.innerHTML=
    '<div class="receipt-item-number">Item <span data-receipt-item-number></span>'+
      '<span class="receipt-item-filing" data-receipt-filing-label></span></div>'+
    '<label class="field">Nomor surat utama (opsional)'+
      '<input data-receipt-primary maxlength="250" autocomplete="off"></label>'+
    '<label class="field">Nomor alternatif/vendor (opsional)'+
      '<input data-receipt-alternate maxlength="250" autocomplete="off"></label>'+
    '<label class="field">Tanggal naskah *'+
      '<input data-receipt-document-date type="date" required></label>'+
    '<label class="field receipt-description">Uraian informasi arsip *'+
      '<textarea data-receipt-description rows="3" maxlength="2000" required></textarea></label>'+
    '<label class="field">Jumlah halaman *'+
      '<input data-receipt-pages type="number" min="1" step="1" required></label>'+
    '<label class="field">Tingkat perkembangan *'+
      '<select data-receipt-development required><option value="ASLI">Asli</option><option value="COPY">Copy</option></select></label>'+
    '<label class="field">Kondisi *'+
      '<select data-receipt-condition required>'+
        '<option value="BAIK">Baik</option>'+
        '<option value="RUSAK RINGAN">Rusak ringan</option>'+
        '<option value="RUSAK SEDANG">Rusak sedang</option>'+
        '<option value="RUSAK BERAT">Rusak berat</option>'+
      '</select></label>'+
    '<label class="field">Klasifikasi keamanan dan akses *'+
      '<select data-receipt-security required>'+
        '<option value="BIASA/TERBUKA">Biasa/Terbuka</option>'+
        '<option value="TERBATAS">Terbatas</option>'+
        '<option value="RAHASIA">Rahasia</option>'+
        '<option value="SANGAT RAHASIA">Sangat Rahasia</option>'+
      '</select></label>'+
    '<label class="field receipt-item-notes">Catatan item (opsional)'+
      '<textarea data-receipt-notes rows="2" maxlength="1000"></textarea></label>'+
    '<button type="button" class="receipt-remove-item" data-remove-receipt-item="'+sequence+'">Hapus</button>';
  $('receiptItems').appendChild(row);
  if(item){
    row.querySelector('[data-receipt-primary]').value=item.primaryLetterNumber||'';
    row.querySelector('[data-receipt-alternate]').value=item.alternateLetterNumber||'';
    row.querySelector('[data-receipt-document-date]').value=item.documentDate||'';
    row.querySelector('[data-receipt-description]').value=item.description||'';
    row.querySelector('[data-receipt-pages]').value=item.pageCount||'';
    row.querySelector('[data-receipt-development]').value=item.developmentLevel||'ASLI';
    row.querySelector('[data-receipt-condition]').value=item.condition||'BAIK';
    row.querySelector('[data-receipt-security]').value=
      item.securityClassification||'BIASA/TERBUKA';
    row.querySelector('[data-receipt-notes]').value=item.notes||'';
    const statusLabel=item.filingStatus==='SUDAH DIBERKASKAN'
      ?'Sudah diberkaskan '+(item.filedBerkasNumber||'')+'/'+(item.filedItemNumber||'')
      :item.filingStatus==='PERLU DILENGKAPI'?'Perlu dilengkapi':'Belum diberkaskan';
    row.querySelector('[data-receipt-filing-label]').textContent=statusLabel;
    row.querySelector('[data-receipt-filing-label]').classList.toggle(
      'filed',item.filingStatus==='SUDAH DIBERKASKAN');
    if(item.canEdit===false){
      row.querySelectorAll('input,textarea,select').forEach(field=>field.disabled=true);
      row.dataset.removable='false';
      row.querySelector('[data-remove-receipt-item]').hidden=true;
    }
    if(item._lockPrintedFields){
      ['description','pages','development','condition','security'].forEach(key=>{
        row.querySelector('[data-receipt-'+key+']').disabled=true;
      });
      row.dataset.removable='false';
      row.querySelector('[data-remove-receipt-item]').hidden=true;
    }
  }
  renumberReceiptItemRows_();
  updateReceiptTotals_();
  if(!item)row.querySelector('[data-receipt-description]').focus();
}

function removeReceiptItemRow_(sequence){
  const rows=receiptItemRows_();
  if(rows.length<=1){toast('Minimal satu item arsip wajib tersedia.',true);return}
  const row=rows.find(item=>item.dataset.receiptItem===String(sequence));
  if(row)row.remove();
  renumberReceiptItemRows_();
  updateReceiptTotals_();
}

function receiptItemRows_(){
  return Array.from($('receiptItems').querySelectorAll('[data-receipt-item]'));
}

function renumberReceiptItemRows_(){
  receiptItemRows_().forEach((row,index)=>{
    row.querySelector('[data-receipt-item-number]').textContent=index+1;
    const remove=row.querySelector('[data-remove-receipt-item]');
    remove.hidden=receiptItemRows_().length===1||row.dataset.removable==='false';
  });
}

function collectReceiptItems_(){
  return receiptItemRows_().map((row,index)=>{
    const description=row.querySelector('[data-receipt-description]').value.trim();
    const pageCount=Number(row.querySelector('[data-receipt-pages]').value);
    const documentDate=row.querySelector('[data-receipt-document-date]').value;
    if(!description)throw new Error('Uraian item '+(index+1)+' wajib diisi.');
    if(!Number.isInteger(pageCount)||pageCount<1)throw new Error('Jumlah halaman item '+(index+1)+' minimal 1.');
    if(!documentDate)throw new Error('Tanggal naskah item '+(index+1)+' wajib diisi.');
    return{
      receiptItemId:row.dataset.receiptItemId||'',
      archiveId:row.dataset.archiveId||'',
      primaryLetterNumber:row.querySelector('[data-receipt-primary]').value.trim(),
      alternateLetterNumber:row.querySelector('[data-receipt-alternate]').value.trim(),
      documentDate:documentDate,
      description:description,
      pageCount:pageCount,
      developmentLevel:row.querySelector('[data-receipt-development]').value,
      condition:row.querySelector('[data-receipt-condition]').value,
      securityClassification:row.querySelector('[data-receipt-security]').value,
      notes:row.querySelector('[data-receipt-notes]').value.trim()
    };
  });
}

function updateReceiptTotals_(){
  const rows=receiptItemRows_();
  const pages=rows.reduce((sum,row)=>sum+Number(row.querySelector('[data-receipt-pages]').value||0),0);
  $('receiptTotals').textContent=rows.length+' item · '+pages+' halaman';
}

async function submitReceipt_(event){
  event.preventDefault();
  let items;
  try{items=collectReceiptItems_()}catch(error){toast(error.message,true);return}
  if(!$('receiptSenderEmployee').value){toast('Pilih pegawai penyerah.',true);return}
  const editing=Boolean($('receiptId').value);
  if(!editing&&!state.receiptSaveRequestId){
    state.receiptSaveRequestId=newReceiptRequestId_();
  }
  const payload={
    receiptId:$('receiptId').value,
    requestId:editing?'':state.receiptSaveRequestId,
    senderEmployeeId:$('receiptSenderEmployee').value,
    receiverName:$('receiptReceiverName').value.trim(),
    receiverUnit:$('receiptReceiverUnit').value.trim(),
    receiptNotes:$('receiptNotes').value.trim(),
    items:items
  };
  const button=$('saveReceipt');
  button.disabled=true;
  button.textContent='Menyimpan…';
  $('receiptFormStatus').textContent='Mencatat penerimaan dan menyiapkan tanda terima…';
  $('loadingTitle').textContent='Menyimpan penerimaan arsip';
  $('loadingMessage').textContent='Mencatat identitas penyerah, penerima, dan daftar item…';
  $('loadingOverlay').hidden=false;
  $('app').setAttribute('aria-busy','true');
  try{
    const startedAt=performance.now();
    let result;
    try{
      result=await runServerWithTimeout_(45000,'apiSaveReceipt',payload);
    }catch(saveError){
      if(saveError.code!=='SERVER_TIMEOUT'||editing)throw saveError;
      $('loadingMessage').textContent='Respons terlambat. Memeriksa apakah data sudah tersimpan…';
      const recovery=await runServerWithTimeout_(
        30000,'apiRecoverReceiptSave',payload.requestId
      );
      if(!recovery||!recovery.found){
        const uncertain=new Error(
          'Status penyimpanan belum dapat dipastikan. Muat ulang halaman dan periksa Riwayat Tanda Terima sebelum mencoba lagi.'
        );
        uncertain.code='SAVE_UNCERTAIN';
        throw uncertain;
      }
      result=recovery;
    }
    state.receiptSaveRequestId='';
    const clientDurationMs=Math.round(performance.now()-startedAt);
    $('loadingMessage').textContent='Menyusun dua rangkap tanda terima A4…';
    try{
      await generateReceiptPdf_(result.receiptId);
    }catch(printError){
      resetReceiptForm_(false);
      state.receiptOptions=null;
      loadReceiptOptions(true).catch(error=>toast(error.message,true));
      $('receiptFormStatus').textContent=result.message+
        ' PDF belum terunduh: '+printError.message+
        '. Gunakan Cetak Ulang pada Riwayat Tanda Terima.';
      toast('Data sudah tersimpan, tetapi PDF belum berhasil dibuat.',true);
      return;
    }
    resetReceiptForm_(false);
    state.receiptOptions=null;
    loadReceiptOptions(true).catch(error=>toast(
      'Data tersimpan, tetapi riwayat belum tersinkron: '+error.message,true
    ));
    const durationMs=Number(result.durationMs||clientDurationMs);
    const durationSeconds=(durationMs/1000).toFixed(1);
    const pathLabel=result.path==='SHEETS_API_BATCH'?'jalur batch':'jalur kompatibilitas';
    const performanceDetail=result.performance&&durationMs>=10000
      ?' (tunggu '+(Number(result.performance.lockWaitMs||0)/1000).toFixed(1)+
        ' dtk · baca '+(Number(result.performance.readMs||0)/1000).toFixed(1)+
        ' dtk · tulis '+(Number(result.performance.writeMs||0)/1000).toFixed(1)+' dtk)'
      :'';
    $('receiptFormStatus').textContent=result.message+
      ' PDF siap dicetak · '+durationSeconds+' detik · '+pathLabel+performanceDetail+'.';
    toast(result.message+' PDF berhasil diunduh.');
  }catch(error){
    $('receiptFormStatus').textContent=(error.code==='SAVE_UNCERTAIN'?
      'Jangan klik Simpan lagi sebelum memeriksa riwayat: ':
      'Penerimaan belum tersimpan: ')+error.message;
    toast(error.message,true);
  }finally{
    $('loadingOverlay').hidden=true;
    $('app').removeAttribute('aria-busy');
    button.disabled=false;
    button.textContent='Simpan & Buat PDF';
  }
}

async function generateReceiptPdf_(receiptId){
  const payload=await runServer('apiPrepareReceiptPrint',receiptId);
  const result=downloadReceiptPdf_(payload);
  await runServer('apiConfirmReceiptPrint',{
    receiptId:payload.receiptId,
    printToken:payload.printToken,
    fileName:payload.fileName
  });
  return result;
}

async function printReceipt_(receiptId){
  $('loadingTitle').textContent='Membuat tanda terima';
  $('loadingMessage').textContent='Mengambil snapshot terbaru dan menyiapkan PDF cetak ulang…';
  $('loadingOverlay').hidden=false;
  $('app').setAttribute('aria-busy','true');
  try{
    const result=await generateReceiptPdf_(receiptId);
    toast('PDF tanda terima berhasil diunduh.');
    state.receiptOptions=null;
    loadReceiptOptions(true).catch(error=>toast(error.message,true));
    return result;
  }catch(error){
    toast(error.message,true);
  }finally{
    $('loadingOverlay').hidden=true;
    $('app').removeAttribute('aria-busy');
  }
}

function visibleReceiptRows_(){

  return rows.filter(row=>{
    if(filter==='AKTIF'&&row.status!=='AKTIF')return false;
    if(filter==='DIBATALKAN'&&row.status!=='DIBATALKAN')return false;
    if(filter==='WITH_EVIDENCE'&&!row.evidenceUrl)return false;
    if(filter==='WITHOUT_EVIDENCE'&&row.evidenceUrl)return false;
    if(!query)return true;
    const corpus=normalizeFolderLabelFilter_([
      row.number,row.senderName,row.senderUnit,row.receiverName,row.receiverUnit,
      row.notes,row.statusLabel,(row.items||[]).map(item=>item.description).join(' ')
    ].join(' '));
    return query.split(' ').filter(Boolean).every(token=>corpus.includes(token));
  });
}

function formatReceiptTimestamp_(value){
  if(!value)return 'Waktu tidak tersedia';
  const date=new Date(value);
  if(isNaN(date))return String(value);
  return new Intl.DateTimeFormat('id-ID',{
    day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',
    timeZone:'Asia/Jakarta'
  }).format(date)+' WIB';
}

function receiptTitleCase_(value){
  return String(value||'').toLowerCase().replace(/\b\w/g,char=>char.toUpperCase());
}

function receiptSecurityLabel_(value){
  const normalized=String(value||'BIASA/TERBUKA').toUpperCase();
  if(normalized==='SANGAT RAHASIA')return 'Sangat Rahasia';
  if(normalized==='RAHASIA')return 'Rahasia';
  if(normalized==='TERBATAS')return 'Terbatas';
  return 'Biasa/Terbuka';
}

function securityRankClient_(value){
  return {'BIASA/TERBUKA':1,'TERBATAS':2,'RAHASIA':3,'SANGAT RAHASIA':4}[
    String(value||'BIASA/TERBUKA').toUpperCase()
  ]||1;
}

function mostRestrictiveSecurityClient_(items){
  return (items||[]).reduce((highest,item)=>{
    const value=String(item.securityClassification||item||'BIASA/TERBUKA').toUpperCase();
    return securityRankClient_(value)>securityRankClient_(highest)?value:highest;
  },'BIASA/TERBUKA');
}

function validateReceiptPdfClient_(file){
  if(!file)throw new Error('Pilih file PDF.');
  const extension=(file.name.split('.').pop()||'').toLowerCase();
  if(extension!=='pdf')throw new Error('Bukti harus berformat PDF.');
  if(file.size>10*1024*1024)throw new Error('Ukuran bukti maksimal 10 MB.');
}

async function receiptEvidenceUpload_(payload,file,button,statusElement,kind){
  const stateKey=kind==='CANCEL'?'receiptCancelUpload':'receiptUpload';
  const signature=JSON.stringify(payload)+'|'+file.name+'|'+file.size+'|'+(file.type||'');
  let upload=state[stateKey];
  if(upload&&upload.signature!==signature){
    if(upload.sessionId){try{await runServer('apiCancelReceiptEvidenceUpload',upload.sessionId)}catch(ignore){}}
    upload=null;
  }
  if(!upload){
    upload={signature:signature,sessionId:'',uploadedBytes:0,chunkSize:512*1024,file:file};
    state[stateKey]=upload;
  }
  try{
    if(!upload.sessionId){
      const started=await runServer('apiStartReceiptEvidenceUpload',Object.assign({},payload,{
        evidenceName:file.name,evidenceSize:file.size,evidenceType:file.type||'application/pdf'
      }));
      upload.sessionId=started.sessionId;
      upload.chunkSize=started.chunkSize||upload.chunkSize;
      upload.uploadedBytes=started.uploadedBytes||0;
    }else{
      const status=await runServer('apiGetReceiptEvidenceUploadStatus',upload.sessionId);
      if(status.committed&&status.result)return status.result;
      upload.uploadedBytes=status.uploadedBytes||0;
    }
    while(upload.uploadedBytes<file.size){
      const start=upload.uploadedBytes;
      const end=Math.min(start+upload.chunkSize,file.size);
      const base64=await fileSliceToBase64(file.slice(start,end,'application/pdf'));
      const progress=await runServer('apiUploadReceiptEvidenceChunk',{
        sessionId:upload.sessionId,start:start,end:end,total:file.size,base64:base64
      });
      if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan bukti. Klik tombol kembali untuk melanjutkan.');
      upload.uploadedBytes=Number(progress.uploadedBytes);
      const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
      button.textContent='Upload '+percent+'%';
      statusElement.textContent='Mengunggah bukti: '+percent+'%.';
    }
    button.textContent='Menyelesaikan…';
    statusElement.textContent='Bukti lengkap. Menghubungkan file dengan tanda terima…';
    return runServer('apiFinalizeReceiptEvidenceUpload',upload.sessionId);
  }catch(error){
    if(/UPLOAD_SESSION_(EXPIRED|NOT_FOUND)/.test(error.message||String(error))){
      upload.sessionId='';
      upload.uploadedBytes=0;
    }
    throw error;
  }
}

  const stateKey=kind==='CANCEL'?'receiptCancelUpload':'receiptUpload';

  state[stateKey]=null;

  }

function visibleFolderLabels_(){
  const rows=state.labelOptions&&state.labelOptions.berkas||[];
  const query=normalizeFolderLabelFilter_($('labelSearch').value);
  const status=$('labelPrintStatus').value;
  return rows.filter(row=>{
    if(status!=='ALL'&&row.printStatus!==status)return false;
    if(!query)return true;
    const corpus=normalizeFolderLabelFilter_([row.number,row.classificationCode,row.title,row.location].join(' '));
    return query.split(' ').filter(Boolean).every(token=>corpus.includes(token));
  });
}

function normalizeFolderLabelFilter_(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').replace(/\s+/g,' ').trim();
}

    return '<tr>'+

async function submitRetentionTransfer(event){
  event.preventDefault();
  const file=$('transferEvidence').files[0];
  if($('transferConfirmation').value.trim().toUpperCase()!=='PINDAHKAN'){
    toast('Ketik PINDAHKAN pada kolom konfirmasi.',true);return;
  }
  if(file){
    const extension=(file.name.split('.').pop()||'').toLowerCase();
    if(!['pdf','jpg','jpeg','png'].includes(extension)){toast('Bukti pemindahan harus PDF, JPG, JPEG, atau PNG.',true);return}
    if(file.size>25*1024*1024){toast('Ukuran bukti pemindahan maksimal 25 MB.',true);return}
  }
  const button=$('markTransferred');
  button.disabled=true;
  button.textContent=file?'Menyiapkan bukti…':'Menyimpan…';
  $('retentionTransferStatus').textContent=file?'Menyiapkan upload bukti pemindahan…':'Mencatat persetujuan dan pemindahan…';
  try{
    const payload=formPayloadWithoutFiles($('retentionTransferForm'));
    let result;
    if(file)result=await transferWithEvidenceUpload_(payload,file,button);
    else{
      if(state.retentionUpload&&state.retentionUpload.sessionId){
        try{await runServer('apiCancelRetentionTransferEvidenceUpload',state.retentionUpload.sessionId)}catch(ignore){}
      }
      state.retentionUpload=null;
      // Pertahanan tambahan untuk kode UI lama yang dipertahankan demi cache.
      // Endpoint ini sengaja tidak ada; CF-04 hanya memakai draft usul di bawah.
      result=await runServer('apiDisabledLegacyTransfer',payload);
    }
    $('retentionTransferStatus').textContent=result.message;
    toast(result.message);
    state.retentionUpload=null;
    state.selectedRetentionId='';
    $('retentionTransferForm').hidden=true;
    $('retentionTransferForm').reset();
    await loadBootstrap();
    await loadRetentionOptions(true);
  }catch(error){
    $('retentionTransferStatus').textContent='Pemindahan belum dicatat: '+error.message;
    toast(error.message,true);
  }finally{
    button.disabled=false;
    button.textContent='Tandai Sudah Dipindahkan';
  }
}

async function transferWithEvidenceUpload_(payload,file,button){
  const signature=JSON.stringify(payload)+'|'+file.name+'|'+file.size+'|'+(file.type||'');
  let upload=state.retentionUpload;
  if(upload&&upload.signature!==signature){
    if(upload.sessionId){try{await runServer('apiCancelRetentionTransferEvidenceUpload',upload.sessionId)}catch(ignore){}}
    upload=null;
  }
  if(!upload){
    upload={signature:signature,sessionId:'',uploadedBytes:0,chunkSize:512*1024,file:file,payload:payload};
    state.retentionUpload=upload;
  }
  if(!upload.sessionId){
    const started=await runServer('apiStartRetentionTransferEvidenceUpload',Object.assign({},payload,{
      evidenceName:file.name,evidenceSize:file.size,evidenceType:file.type||''
    }));
    upload.sessionId=started.sessionId;
    upload.chunkSize=started.chunkSize||upload.chunkSize;
    upload.uploadedBytes=started.uploadedBytes||0;
  }else{
    const status=await runServer('apiGetRetentionTransferEvidenceUploadStatus',upload.sessionId);
    if(status.committed&&status.result)return status.result;
    upload.uploadedBytes=status.uploadedBytes||0;
  }
  while(upload.uploadedBytes<file.size){
    const start=upload.uploadedBytes;
    const end=Math.min(start+upload.chunkSize,file.size);
    const base64=await fileSliceToBase64(file.slice(start,end,file.type||'application/octet-stream'));
    const progress=await runServer('apiUploadRetentionTransferEvidenceChunk',{
      sessionId:upload.sessionId,start:start,end:end,total:file.size,base64:base64
    });
    if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan bukti pemindahan. Klik kembali tombol pemindahan.');
    upload.uploadedBytes=Number(progress.uploadedBytes);
    const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
    button.textContent='Upload bukti '+percent+'%';
    $('retentionTransferStatus').textContent='Mengunggah bukti pemindahan: '+percent+'%. Status berkas belum diubah.';
  }
  button.textContent='Menyelesaikan…';
  $('retentionTransferStatus').textContent='Bukti lengkap. Mencatat persetujuan dan pemindahan…';
  return runServer('apiFinalizeRetentionTransferEvidenceUpload',upload.sessionId);
}

async function submitTransferSubmission_(event){
  event.preventDefault();
  const proposalId=$('transferSubmissionProposalId').value;
  const file=$('transferNotaDinasFile').files[0];
  const confirmation=$('transferSubmissionConfirmation').value.trim().toUpperCase();
  if(!proposalId){toast('ID draft usul tidak ditemukan.',true);return}
  if(!file){toast('Pilih PDF Nota Dinas yang telah mendapat disposisi.',true);return}
  if(!file.name.toLowerCase().endsWith('.pdf')){toast('Nota Dinas harus berupa PDF.',true);return}
  if(file.size>=10*1024*1024){toast('Ukuran Nota Dinas harus kurang dari 10 MB.',true);return}
  if(confirmation!=='AJUKAN'){toast('Ketik AJUKAN untuk mengonfirmasi.',true);return}
  const signature=[proposalId,file.name,file.size,file.lastModified,
    $('transferRecordCenterName').value,$('transferRecordCenterEmail').value].join('|');
  let upload=state.transferSubmissionUpload;
  if(upload&&upload.signature!==signature){
    if(upload.sessionId){try{await runServer('apiCancelTransferSubmissionUpload',upload.sessionId)}catch(ignore){}}
    upload=null;
  }
  if(!upload){
    upload={signature:signature,sessionId:'',uploadedBytes:0,chunkSize:512*1024,file:file,committed:false};
    state.transferSubmissionUpload=upload;
  }
  const button=$('submitTransferProposal');
  button.disabled=true;
  try{
    if(!upload.sessionId){
      $('transferSubmissionStatus').textContent='Memulai upload Nota Dinas…';
      const started=await runServer('apiStartTransferSubmissionUpload',{
        proposalId:proposalId,
        recordCenterName:$('transferRecordCenterName').value,
        recordCenterEmail:$('transferRecordCenterEmail').value,
        confirmation:confirmation,
        fileName:file.name,fileSize:file.size,mimeType:file.type
      });
      upload.sessionId=started.sessionId;
      upload.chunkSize=started.chunkSize||upload.chunkSize;
      upload.uploadedBytes=started.uploadedBytes||0;
    }else{
      const status=await runServer('apiGetTransferSubmissionUploadStatus',upload.sessionId);
      if(status.committed&&status.result){
        upload.committed=true;
        await finishTransferSubmission_(status.result);
        return;
      }
      upload.uploadedBytes=status.uploadedBytes||0;
    }
    while(upload.uploadedBytes<file.size){
      const start=upload.uploadedBytes;
      const end=Math.min(start+upload.chunkSize,file.size);
      const base64=await fileSliceToBase64(file.slice(start,end,'application/pdf'));
      const progress=await runServer('apiUploadTransferSubmissionChunk',{
        sessionId:upload.sessionId,start:start,end:end,total:file.size,base64:base64
      });
      if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan Nota Dinas. Klik Upload & Ajukan kembali.');
      upload.uploadedBytes=Number(progress.uploadedBytes);
      const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
      $('transferSubmissionStatus').textContent='Mengunggah Nota Dinas… '+percent+'%';
    }
    $('transferSubmissionStatus').textContent='Mengunci paket dan mencatat pengajuan…';
    const result=await runServer('apiFinalizeTransferSubmissionUpload',upload.sessionId);
    upload.committed=true;
    await finishTransferSubmission_(result);
  }catch(error){
    $('transferSubmissionStatus').textContent='Pengajuan belum selesai: '+error.message;
    if(/UPLOAD_SESSION_(EXPIRED|NOT_FOUND)/.test(error.message)){
      upload.sessionId='';upload.uploadedBytes=0;
    }
    toast(error.message,true);
  }finally{
    button.disabled=false;
    button.textContent='Upload & Ajukan';
  }
}

async function loadLoanOptions(force=false,quiet=false,preserveForm=false){
  if(state.loanOptions&&!force){renderLoanPage_();return}
  if(!quiet){
    $('loanTableEmpty').hidden=false;
    $('loanTableEmpty').textContent='Memuat transaksi peminjaman…';
    $('loanTableWrap').hidden=true;
    $('loanFormStatus').textContent='Memuat daftar arsip aktif…';
  }
  try{
    state.loanOptions=await runServer('apiGetLoanOptions');
    if(preserveForm){
      renderLoanStats_();
      renderLoanTable_();
    }else renderLoanPage_();
    if(!quiet)$('loanFormStatus').textContent='Lengkapi data peminjaman.';
  }catch(error){
    if(!quiet){
      $('loanTableEmpty').textContent='Data peminjaman gagal dimuat.';
      $('loanFormStatus').textContent='Gagal memuat daftar arsip.';
      toast(error.message,true);
    }else{
      throw error;
    }
  }
}

function renderLoanBerkasOptions_(){
  const select=$('loanBerkasId');
  const previous=select.value;
  const objectType=$('loanObjectType').value;
  $('loanItemField').hidden=objectType!=='ITEM';
  if(!state.loanOptions){
    $('loanObjectInfo').textContent='Menyinkronkan ulang daftar arsip…';
    recoverLoanOptions_();
    return;
  }
  select.innerHTML='<option value="">Pilih berkas induk</option>';
  (state.loanOptions.berkas||[]).forEach(row=>{
    const option=new Option(row.label,row.id);
    option.disabled=objectType==='BERKAS'
      ? Boolean(row.fullLoanBlocked)
      : row.loanStatus==='DIPINJAM';
    if(option.disabled)option.text=row.label+' · '+row.loanStatus;
    select.add(option);
  });
  if(previous&&[...select.options].some(option=>option.value===previous&&!option.disabled))select.value=previous;
  renderLoanItems_();
  renderLoanObjectInfo_();
}

function renderLoanItems_(){
  const picker=$('loanItemPicker');
  const berkasId=$('loanBerkasId').value;
  if(!state.loanOptions){
    picker.innerHTML='<span class="helper">Menyinkronkan ulang data item…</span>';
    recoverLoanOptions_();
    return;
  }
  if(!berkasId){
    state.selectedLoanItemIds.clear();
    picker.innerHTML='<span class="helper">Pilih berkas terlebih dahulu.</span>';
    updateLoanItemSelectionSummary_();
    return;
  }
  const items=(state.loanOptions.itemsByBerkas||{})[berkasId]||[];
  const validIds=new Set(items.map(row=>row.id));
  state.selectedLoanItemIds.forEach(id=>{if(!validIds.has(id))state.selectedLoanItemIds.delete(id)});
  const query=normalizeFolderLabelFilter_($('loanItemSearch').value);
  const visible=items.filter(row=>{
    if(!query)return true;
    return normalizeFolderLabelFilter_([row.number,row.documentDate,row.description].join(' '))
      .includes(query);
  });
  picker.innerHTML=visible.length?visible.map(row=>{
    const available=String(row.loanStatus||'TERSEDIA').toUpperCase()==='TERSEDIA';
    const checked=state.selectedLoanItemIds.has(row.id)?' checked':'';
    return '<label class="loan-item-choice'+(available?'':' disabled')+'">'+
      '<input type="checkbox" data-loan-item-id="'+escapeHtml(row.id)+'"'+checked+(available?'':' disabled')+'>'+
      '<span><strong>Item '+escapeHtml(row.number||'–')+'</strong> · '+escapeHtml(row.description)+
      '<small>'+escapeHtml((row.documentDate||'Tanggal tidak tersedia')+' · '+row.pageCount+' lembar · '+row.loanStatus)+'</small></span></label>';
  }).join(''):'<span class="helper">Tidak ada item yang sesuai pencarian.</span>';
  updateLoanItemSelectionSummary_();
}

function visibleAvailableLoanItems_(){
  const berkasId=$('loanBerkasId').value;
  const query=normalizeFolderLabelFilter_($('loanItemSearch').value);
  return ((state.loanOptions&&state.loanOptions.itemsByBerkas||{})[berkasId]||[])
    .filter(row=>String(row.loanStatus||'TERSEDIA').toUpperCase()==='TERSEDIA')
    .filter(row=>!query||normalizeFolderLabelFilter_([row.number,row.documentDate,row.description].join(' ')).includes(query));
}

function updateLoanItemSelectionSummary_(){
  const selected=selectedLoanItems_();

function selectedLoanItems_(){
  const berkasId=$('loanBerkasId').value;
  const byId={};
  (((state.loanOptions&&state.loanOptions.itemsByBerkas)||{})[berkasId]||[])
    .forEach(row=>byId[row.id]=row);

  if(state.loanOptionsPromise)return state.loanOptionsPromise;
  state.loanOptionsPromise=loadLoanOptions(true,true,false)
    .catch(error=>toast('Data Peminjaman gagal disinkronkan ulang: '+error.message,true))
    .finally(()=>state.loanOptionsPromise=null);

  if(!state.loanOptions){
    $('loanObjectInfo').textContent='Pilih berkas atau item yang akan dipinjam.';
    return;
  }
  const objectType=$('loanObjectType').value;
  const berkas=(state.loanOptions.berkas||[]).find(row=>row.id===$('loanBerkasId').value);
  if(!berkas){
    $('loanObjectInfo').textContent='Pilih berkas atau item yang akan dipinjam.';

  }
  if(objectType==='BERKAS'){
    $('loanPageCount').value=berkas.pageCount||'';
    $('loanObjectInfo').innerHTML='<strong>'+escapeHtml((berkas.number||'DRAFT')+' – '+berkas.title)+'</strong><br>'+
      escapeHtml(berkas.itemCount+' item · '+berkas.pageCount+' lembar · '+berkas.location)+
      (berkas.loanStatus!=='TERSEDIA'?'<br><span class="loan-warning">Status: '+escapeHtml(berkas.loanStatus)+'</span>':'');
    return;
  }
  const items=selectedLoanItems_();
  if(!items.length){
    $('loanPageCount').value='';
    $('loanObjectInfo').innerHTML='<strong>'+escapeHtml((berkas.number||'DRAFT')+' – '+berkas.title)+'</strong><br>Pilih satu atau beberapa item arsip.';
    return;
  }
  const totalPages=items.reduce((sum,row)=>sum+Number(row.pageCount||0),0);
  $('loanPageCount').value=totalPages||'';
  const numbers=items.map(item=>item.number||'–').join(', ');
  $('loanObjectInfo').innerHTML='<strong>'+escapeHtml(items.length+' item dipilih: '+numbers)+'</strong><br>'+
    escapeHtml(totalPages+' lembar · lokasi asal '+berkas.location)+
    '<br><span class="search-cell-sub">Out Indicator A5 akan dibuat setelah transaksi inti tersimpan.</span>';

function applyLoanCreateOptimistically_(payload,result){
  if(!state.loanOptions)return;
  const parent=(state.loanOptions.berkas||[]).find(row=>row.id===payload.loanBerkasId);
  const items=((state.loanOptions.itemsByBerkas||{})[payload.loanBerkasId]||[]);
  let selectedIds=[];
  try{selectedIds=JSON.parse(payload.loanItemIdsJson||'[]')}catch(ignore){}
  if(!selectedIds.length&&payload.loanItemId)selectedIds=[payload.loanItemId];
  const selectedItems=selectedIds.map(id=>items.find(row=>row.id===id)).filter(Boolean);
  const item=selectedItems[0];
  let loan=result.loan;
  if(!loan){
    const objectType=String(payload.loanObjectType||'BERKAS').toUpperCase();
    const dueDate=payload.loanDueDate||'';
    const overdue=dueDate&&dueDate<(state.loanOptions.today||'');
    loan={
      id:result.loanId||payload.loanPreviewId,
      objectType:objectType,
      berkasId:payload.loanBerkasId,
      itemId:objectType==='ITEM'?payload.loanItemId:'',
      itemIds:objectType==='ITEM'?selectedIds:[],
      itemCount:objectType==='ITEM'?selectedIds.length:0,
      berkasNumber:parent&&parent.number||'',
      itemNumber:item&&item.number||'',
      title:objectType==='ITEM'&&selectedIds.length>1
        ?selectedIds.length+' item arsip dalam berkas '+(parent&&parent.number||'–')
        :objectType==='ITEM'?(item&&item.description||'Item arsip'):(parent&&parent.title||'Berkas arsip'),
      borrowerName:payload.borrowerName||'',
      borrowerIdentity:payload.borrowerIdentity||'',
      borrowerUnit:payload.borrowerUnit||'',
      whatsapp:payload.borrowerWhatsapp||'',
      purpose:payload.loanPurpose||'',
      borrowDate:payload.loanDate||'',
      dueDate:dueDate,
      returnedDate:'',
      pageCount:Number(payload.loanPageCount||0),
      evidenceUrl:result.evidenceUrl||'',
      notes:payload.loanNotes||'',
      statusCode:overdue?'OVERDUE':'ACTIVE',
      statusLabel:overdue?'TERLAMBAT':'DIPINJAM',
      overdueDays:0
    };
  }
  const existingIndex=(state.loanOptions.loans||[]).findIndex(row=>row.id===loan.id);
  if(existingIndex===-1)state.loanOptions.loans.unshift(loan);
  else state.loanOptions.loans[existingIndex]=loan;
  recalculateLoanClientState_();
}

function applyLoanReturnOptimistically_(loanId,returnedDate){
  if(!state.loanOptions)return;
  const loan=(state.loanOptions.loans||[]).find(row=>row.id===loanId);
  if(!loan)return;
  loan.statusCode='RETURNED';
  loan.statusLabel='SUDAH KEMBALI';
  loan.returnedDate=returnedDate;
  loan.overdueDays=0;
  recalculateLoanClientState_();
}

function recalculateLoanClientState_(){
  if(!state.loanOptions)return;
  const loans=state.loanOptions.loans||[];
  const active=loans.filter(row=>row.statusCode==='ACTIVE'||row.statusCode==='OVERDUE');
  const summary=state.loanOptions.summary||{};
  summary.active=active.length;
  summary.overdue=active.filter(row=>row.statusCode==='OVERDUE').length;
  summary.borrowedBerkas=active.filter(row=>row.objectType==='BERKAS').length;
  summary.borrowedItems=active.filter(row=>row.objectType==='ITEM')
    .reduce((sum,row)=>sum+Number(row.itemCount||1),0);
  summary.returned=loans.filter(row=>row.statusCode==='RETURNED').length;
  (state.loanOptions.berkas||[]).forEach(parent=>{
    const whole=active.some(row=>row.objectType==='BERKAS'&&row.berkasId===parent.id);
    const partial=active.some(row=>row.objectType==='ITEM'&&row.berkasId===parent.id);
    parent.loanStatus=whole?'DIPINJAM':partial?'SEBAGIAN DIPINJAM':'TERSEDIA';
    parent.fullLoanBlocked=whole||partial;
    parent.fullLoanBlockingReason=whole?'Berkas sudah mempunyai peminjaman aktif.':
      partial?'Satu atau lebih item dalam berkas sedang dipinjam.':'';
    const items=((state.loanOptions.itemsByBerkas||{})[parent.id]||[]);
    items.forEach(item=>{
      const borrowed=active.some(row=>row.objectType==='ITEM'&&
        (row.itemId===item.id||(row.itemIds||[]).includes(item.id)));
      item.loanStatus=whole?'DIPINJAM DALAM BERKAS':borrowed?'DIPINJAM':'TERSEDIA';
    });
  });
  renderLoanStats_();
  if(state.bootstrap&&state.bootstrap.dashboard){
    state.bootstrap.dashboard.activeLoans=summary.active||0;
    renderDashboard();
  }
  renderLoanTable_();
}

async function submitLoan_(event){
  event.preventDefault();
  const objectType=$('loanObjectType').value;
  const selectedItems=selectedLoanItems_();
  if(objectType==='ITEM'&&!selectedItems.length){toast('Pilih minimal satu item arsip yang dipinjam.',true);return}
  if($('loanDueDate').value<$('loanDate').value){toast('Tanggal wajib kembali tidak boleh lebih awal daripada tanggal pinjam.',true);return}
  const file=$('loanEvidence').files[0];
  if(file){
    const extension=(file.name.split('.').pop()||'').toLowerCase();
    if(!['pdf','jpg','jpeg','png'].includes(extension)){toast('Bukti persetujuan harus PDF, JPG, JPEG, atau PNG.',true);return}
    if(file.size>25*1024*1024){toast('Ukuran bukti persetujuan maksimal 25 MB.',true);return}
  }
  if(!$('loanPreviewId').value)$('loanPreviewId').value=newClientId('LOAN');
  const payload=formPayloadWithoutFiles($('loanForm'));
  payload.loanItemIdsJson=objectType==='ITEM'
    ?JSON.stringify(selectedItems.map(row=>row.id)):'[]';
  payload.loanItemId=objectType==='ITEM'&&selectedItems.length?selectedItems[0].id:'';
  const button=$('saveLoan');
  button.disabled=true;
  button.textContent=file?'Menyiapkan bukti…':'Menyimpan…';
  $('loanFormStatus').textContent=file?'Menyiapkan upload bukti persetujuan…':'Mencatat peminjaman…';
  try{
    let result;
    if(file)result=await loanWithEvidenceUpload_(payload,file,button);
    else{
      await resetLoanUpload_();
      result=await runServer('apiCreateLoan',payload);
    }
    applyLoanCreateOptimistically_(payload,result);
    toast(result.message);
    state.loanUpload=null;
    await resetLoanForm_(false);
    const duration=result.durationMs?Math.max(.1,result.durationMs/1000).toFixed(1)+' detik':'';
    const performance=result.performance||{};
    const pathLabel=performance.path==='SHEETS_API_BATCH'?' · jalur batch':
      performance.path==='SPREADSHEET_FALLBACK'?' · jalur kompatibilitas':'';
    const slowDetail=result.durationMs>=10000
      ?' [tunggu '+Math.round(Number(performance.lockWaitMs||0)/100)/10+
        ' dtk; baca '+Math.round(Number(performance.readMs||0)/100)/10+
        ' dtk; tulis '+Math.round(Number(performance.writeMs||0)/100)/10+' dtk]'
      :'';
    const successMessage='Peminjaman tersimpan'+(duration?' dalam '+duration:'')+
      pathLabel+slowDetail+'.';
    $('loanFormStatus').textContent=successMessage+' Menyiapkan Out Indicator A5, Berita Acara (satu dokumen Peminjaman+Pengembalian), dan menyegarkan data di latar belakang…';
    prepareAndDownloadLoanOutIndicator_(result.loanGroupId||result.loanId,true)
      .catch(()=>{});
    // Satu dokumen berisi bagian Peminjaman (terisi) dan bagian Pengembalian
    // (formulir kosong, siap diisi tangan saat arsipnya benar-benar kembali —
    // lihat prepareLoanBeritaAcara_).
    prepareAndDownloadLoanBeritaAcara_(result.loanGroupId||result.loanId,true,'loanFormStatus')
      .catch(()=>{});
    refreshLoanViewsInBackground_(successMessage);
  }catch(error){
    $('loanFormStatus').textContent='Peminjaman belum tersimpan: '+error.message;
    toast(error.message,true);
  }finally{
    button.disabled=false;
    button.textContent='Simpan Peminjaman';
  }
}

async function loanWithEvidenceUpload_(payload,file,button){
  const signature=JSON.stringify(payload)+'|'+file.name+'|'+file.size+'|'+(file.type||'');
  let upload=state.loanUpload;
  if(upload&&upload.signature!==signature){
    if(upload.sessionId){try{await runServer('apiCancelLoanEvidenceUpload',upload.sessionId)}catch(ignore){}}
    upload=null;
  }
  if(!upload){
    upload={signature:signature,sessionId:'',uploadedBytes:0,chunkSize:512*1024,file:file,payload:payload};
    state.loanUpload=upload;
  }
  if(!upload.sessionId){
    const started=await runServer('apiStartLoanEvidenceUpload',Object.assign({},payload,{
      evidenceName:file.name,evidenceSize:file.size,evidenceType:file.type||''
    }));
    upload.sessionId=started.sessionId;
    upload.chunkSize=started.chunkSize||upload.chunkSize;
    upload.uploadedBytes=started.uploadedBytes||0;
  }else{
    const status=await runServer('apiGetLoanEvidenceUploadStatus',upload.sessionId);
    if(status.committed&&status.result)return status.result;
    upload.uploadedBytes=status.uploadedBytes||0;
  }
  while(upload.uploadedBytes<file.size){
    const start=upload.uploadedBytes;
    const end=Math.min(start+upload.chunkSize,file.size);
    const base64=await fileSliceToBase64(file.slice(start,end,file.type||'application/octet-stream'));
    const progress=await runServer('apiUploadLoanEvidenceChunk',{
      sessionId:upload.sessionId,start:start,end:end,total:file.size,base64:base64
    });
    if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan bukti. Tekan kembali Simpan Peminjaman.');
    upload.uploadedBytes=Number(progress.uploadedBytes);
    const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
    button.textContent='Upload bukti '+percent+'%';
    $('loanFormStatus').textContent='Mengunggah bukti persetujuan: '+percent+'%. Peminjaman belum dicatat.';
  }
  button.textContent='Menyelesaikan…';
  $('loanFormStatus').textContent='Bukti lengkap. Mencatat peminjaman dan memperbarui status arsip…';
  return runServer('apiFinalizeLoanEvidenceUpload',upload.sessionId);
}

async function prepareAndDownloadLoanOutIndicator_(loanGroupId,automatic=false){
  if(!loanGroupId)throw new Error('ID transaksi peminjaman tidak tersedia.');
  if(!automatic)toast('Menyiapkan Out Indicator A5…');
  try{
    const payload=await runServer('apiPrepareLoanOutIndicator',loanGroupId);
    const result=downloadLoanOutIndicatorPdf_(payload);
    const message='Out Indicator A5 berhasil dibuat'+
      (payload.isReprint?' (cetak ulang ke-'+payload.printSequence+')':'')+
      ' · '+result.pageCount+' halaman.';
    $('loanFormStatus').textContent=message;
    toast(message);
    // Simpan salinan ke Drive (folder Central File/Out Indicator) di latar
    // belakang — tidak memblokir unduhan yang sudah terjadi di browser.
    runServer('apiSaveOutIndicatorPdf',loanGroupId,result.base64,payload.fileName)
      .catch(()=>{});
    return result;
  }catch(error){
    const message='Out Indicator belum dapat dibuat: '+error.message+
      '. Peminjaman tetap sudah tersimpan; gunakan tombol Cetak Out Indicator pada tabel.';
    $('loanFormStatus').textContent=message;
    toast(message,true);
    throw error;
  }
}

async function prepareAndDownloadLoanBeritaAcara_(loanGroupId,automatic=false,statusFieldId,button){
  if(!loanGroupId)throw new Error('ID transaksi peminjaman tidak tersedia.');
  const statusField=statusFieldId||'loanFormStatus';
  const originalButtonText=button?button.textContent:'';
  // Dua gaya indikator "sedang berjalan" supaya petugas tidak mengira sistem
  // macet: overlay layar penuh (dengan pesan bertahap, sama seperti saat
  // menyimpan item arsip) untuk klik tombol manual — karena itu satu-satunya
  // hal yang sedang ditunggu pengguna — dan spinner kecil di teks status
  // untuk pembuatan otomatis di latar belakang, yang tidak boleh memblokir
  // halaman karena transaksi utamanya sudah selesai duluan.
  if(automatic){
    if($(statusField))$(statusField).innerHTML='<span class="inline-spinner" aria-hidden="true"></span>Menyiapkan Berita Acara Peminjaman…';
  }else{
    toast('Menyiapkan Berita Acara Peminjaman…');
    if(button){button.disabled=true;button.textContent='Menyiapkan…'}
    showBeritaAcaraOverlay_();
  }
  try{
    const result=await runServerWithTimeout_(60000,'apiPrepareLoanBeritaAcara',loanGroupId);
    if($(statusField))$(statusField).textContent=result.message;
    toast(result.message);
    // window.open otomatis (tanpa klik langsung) sering diblokir browser sebagai
    // popup. Buka tab baru hanya untuk klik manual tombol Cetak; hasil pembuatan
    // otomatis cukup tersedia lewat tombol Cetak BA pada tabel begitu data disegarkan.
    if(!automatic)window.open(result.pdfUrl,'_blank');
    state.loanOptions=null;
    return result;
  }catch(error){
    const message='Berita Acara Peminjaman belum dapat dibuat: '+error.message+
      '. Transaksi tetap sudah tersimpan; gunakan tombol Cetak BA Peminjaman pada tabel.';
    if($(statusField))$(statusField).textContent=message;
    toast(message,true);
    throw error;
  }finally{
    if(!automatic){
      hideBeritaAcaraOverlay_();
      if(button){button.disabled=false;button.textContent=originalButtonText||'Cetak BA Peminjaman'}
    }
  }
}

function renderLoanTable_(){
  if(!state.loanOptions)return;
  const query=normalizeFolderLabelFilter_($('loanSearch').value);
  const filter=$('loanStatusFilter').value;
  const rows=(state.loanOptions.loans||[]).filter(row=>{
    const statusMatch=filter==='ALL' ||
      filter==='ACTIVE'&&(row.statusCode==='ACTIVE'||row.statusCode==='OVERDUE') ||
      row.statusCode===filter;
    if(!statusMatch)return false;
    if(!query)return true;
    const haystack=normalizeFolderLabelFilter_([
      row.berkasNumber,row.itemNumber,row.title,row.borrowerName,row.borrowerIdentity,
      (row.itemTitles||[]).join(' '),row.borrowerUnit,row.whatsapp,row.purpose,row.notes
    ].join(' '));
    return query.split(' ').every(token=>haystack.includes(token));
  });
  $('loanResultsBody').innerHTML=rows.map(renderLoanRow_).join('');
  $('loanTableEmpty').hidden=rows.length>0;
  $('loanTableWrap').hidden=rows.length===0;
  $('loanTableEmpty').textContent=(state.loanOptions.loans||[]).length
    ? 'Tidak ada transaksi yang sesuai dengan filter.'
    : 'Belum ada transaksi peminjaman.';
}

function renderLoanRow_(row){
  const objectNumber=row.objectType==='BERKAS'
    ? 'Berkas '+(row.berkasNumber||'DRAFT')
    : row.itemCount>1
      ? 'Berkas '+(row.berkasNumber||'–')+' / '+row.itemCount+' item ('+(row.itemNumbers||[]).join(', ')+')'
      : 'Berkas '+(row.berkasNumber||'–')+' / Item '+(row.itemNumber||'–');
  const borrowerContact=[
    row.borrowerIdentity?'NIP/NIK '+row.borrowerIdentity:'',
    row.whatsapp?'WA '+row.whatsapp:''
  ].filter(Boolean).join(' · ');
  const schedule=row.returnedDate
    ? 'Kembali '+formatIndonesianDate_(row.returnedDate)
    : 'Wajib kembali '+formatIndonesianDate_(row.dueDate);
  const statusClass=row.statusCode==='OVERDUE'?'danger':row.statusCode==='ACTIVE'?'warning':'success';
  const overdue=row.statusCode==='OVERDUE'
    ? '<span class="search-cell-sub loan-overdue">'+row.overdueDays+' hari terlambat</span>' : '';
  const evidence=row.evidenceUrl
    ? '<a class="loan-evidence-link" href="'+escapeHtml(row.evidenceUrl)+'" target="_blank" rel="noopener">Buka bukti</a>'
    : '<span class="search-cell-sub">Tanpa bukti digital</span>';
  const returnAction=row.statusCode==='RETURNED'
    ? '<button type="button" class="loan-action-button" disabled>Selesai</button>'
    : '<button type="button" class="loan-action-button" data-return-loan="'+escapeHtml(row.id)+'">Catat Kembali</button>';
  const printAction='<button type="button" class="loan-action-button secondary" data-print-out-indicator="'+
    escapeHtml(row.groupId||row.id)+'">'+(row.statusCode==='RETURNED'?'Cetak Riwayat':'Cetak Out Indicator')+'</button>';
  const baAction='<button type="button" class="loan-action-button secondary" data-print-ba="'+
    escapeHtml(row.groupId||row.id)+'">Cetak BA Peminjaman</button>';
  const itemDetail=row.itemCount>1
    ?'<span class="search-cell-sub">'+escapeHtml((row.itemTitles||[]).join(' · '))+'</span>':'';
  return '<tr>'+
    '<td><span class="search-number">'+escapeHtml(objectNumber)+'</span><span class="search-cell-main">'+escapeHtml(row.title)+'</span>'+itemDetail+'<span class="search-cell-sub">'+escapeHtml(row.objectType)+'</span></td>'+
    '<td><span class="search-cell-main">'+escapeHtml(row.borrowerName)+'</span><span class="search-cell-sub">'+escapeHtml(row.borrowerUnit)+'</span><span class="search-cell-sub">'+escapeHtml(borrowerContact)+'</span><span class="search-cell-sub">'+escapeHtml(row.purpose)+'</span></td>'+
    '<td><span class="search-cell-main">Pinjam '+formatIndonesianDate_(row.borrowDate)+'</span><span class="search-cell-sub">'+escapeHtml(schedule)+'</span>'+overdue+'</td>'+
    '<td><span class="search-cell-main">'+escapeHtml(row.pageCount)+' lembar/item</span></td>'+
    '<td><span class="status-badge '+statusClass+'">'+escapeHtml(row.statusLabel)+'</span>'+evidence+'</td>'+
    '<td><div class="loan-actions">'+printAction+baAction+returnAction+'</div></td>'+
  '</tr>';
}

function formatIndonesianDate_(value){
  if(!value)return '–';
  const match=String(value).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match)return escapeHtml(value);
  const months=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  return Number(match[3])+' '+months[Number(match[2])-1]+' '+match[1];
}

async function submitMediaUpload(event){
  event.preventDefault();
  const berkasId=$('mediaBerkasId').value;
  const itemId=$('mediaItemId').value;
  const file=$('mediaPdf').files[0];
  if(!berkasId||!itemId){toast('Pilih berkas dan item yang akan dilengkapi.',true);return}
  if(!file){toast('Pilih PDF alih media.',true);return}
  if(file.type&&file.type!=='application/pdf'){toast('File alih media harus PDF.',true);return}
  if(file.size>=ARCHIVE_MEDIA_MAX_BYTES){toast('Ukuran PDF harus kurang dari 100 MB.',true);return}
  const button=$('uploadMedia');
  button.disabled=true;
  try{
    let upload=state.mediaUpload;
    if(!upload||upload.itemId!==itemId||upload.file!==file){
      upload={berkasId:berkasId,itemId:itemId,file:file,sessionId:'',uploadedBytes:0,chunkSize:512*1024};
      state.mediaUpload=upload;
    }
    if(!upload.sessionId){
      button.textContent='Memulai upload…';
      const started=await runServer('apiStartMediaUpload',{berkasId:berkasId,itemId:itemId,fileName:file.name,fileSize:file.size,mimeType:file.type||'application/pdf'});
      upload.sessionId=started.sessionId;
      upload.uploadedBytes=started.uploadedBytes||0;
      upload.chunkSize=started.chunkSize||upload.chunkSize;
    }else{
      const status=await runServer('apiGetMediaUploadStatus',upload.sessionId);
      if(status.committed&&status.result){await finishMediaUpload(status.result);return}
      upload.uploadedBytes=status.uploadedBytes||0;
    }
    while(upload.uploadedBytes<file.size){
      const start=upload.uploadedBytes;
      const end=Math.min(start+upload.chunkSize,file.size);
      const base64=await fileSliceToBase64(file.slice(start,end,'application/pdf'));
      const progress=await runServer('apiUploadMediaChunk',{sessionId:upload.sessionId,start:start,end:end,total:file.size,base64:base64});
      if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan PDF. Tekan Upload Alih Media untuk melanjutkan.');
      upload.uploadedBytes=Number(progress.uploadedBytes);
      const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
      button.textContent='Upload '+percent+'%';
      $('mediaStatus').textContent='Mengunggah PDF: '+percent+'%.';
    }
    button.textContent='Menyelesaikan…';
    $('mediaStatus').textContent='PDF lengkap. Menghubungkan file ke item arsip…';
    const result=await runServer('apiFinalizeMediaUpload',upload.sessionId);
    await finishMediaUpload(result);
  }catch(error){
    const message=error.message||String(error);
    if(/UPLOAD_SESSION_(EXPIRED|NOT_FOUND)/.test(message)&&state.mediaUpload){state.mediaUpload.sessionId='';state.mediaUpload.uploadedBytes=0}
    button.disabled=false;
    button.textContent='Lanjutkan Upload';
    $('mediaStatus').textContent='Upload terhenti. Tekan tombol untuk melanjutkan: '+message;
    toast(message,true);
  }
}

async function finishMediaUpload(result){
  const berkasId=result.berkasId;
  state.mediaUpload=null;
  $('mediaPdf').value='';
  $('uploadMedia').disabled=false;
  $('uploadMedia').textContent='Upload Alih Media';
  $('mediaStatus').textContent=result.message;
  state.mediaOptions=null;
  state.editOptions=null;
  await Promise.all([loadMediaOptions(true,berkasId),loadBootstrap()]);
  toast(result.message);
}

async function editWithReplacementUpload(payload,file,button){
  const signature=JSON.stringify(payload)+'|'+file.name+'|'+file.size+'|'+(file.type||'');
  let upload=state.editUpload;
  if(upload&&upload.signature!==signature){
    if(upload.sessionId){try{await runServer('apiCancelEditReplacementUpload',upload.sessionId)}catch(ignore){}}
    upload=null;
  }
  if(!upload){
    upload={signature:signature,sessionId:'',uploadedBytes:0,chunkSize:512*1024};
    state.editUpload=upload;
  }
  try{
    if(!upload.sessionId){
      const request=Object.assign({},payload,{
        replacementName:file.name,
        replacementSize:file.size,
        replacementType:file.type||'application/pdf'
      });
      const started=await runServer('apiStartEditReplacementUpload',request);
      upload.sessionId=started.sessionId;
      upload.chunkSize=started.chunkSize||upload.chunkSize;
      upload.uploadedBytes=started.uploadedBytes||0;
    }else{
      const status=await runServer('apiGetEditReplacementUploadStatus',upload.sessionId);
      if(status.committed&&status.result)return status.result;
      upload.uploadedBytes=status.uploadedBytes||0;
    }
    while(upload.uploadedBytes<file.size){
      const start=upload.uploadedBytes;
      const end=Math.min(start+upload.chunkSize,file.size);
      const base64=await fileSliceToBase64(file.slice(start,end,'application/pdf'));
      const progress=await runServer('apiUploadEditReplacementChunk',{
        sessionId:upload.sessionId,start:start,end:end,total:file.size,base64:base64
      });
      if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan PDF pengganti. Klik Simpan Perubahan kembali.');
      upload.uploadedBytes=Number(progress.uploadedBytes);
      const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
      button.textContent='Upload PDF '+percent+'%';
      $('editStatus').textContent='Mengunggah PDF pengganti: '+percent+'%. Data lama masih aman.';
    }
    button.textContent='Menyelesaikan…';
    $('editStatus').textContent='PDF lengkap. Memperbarui metadata, penomoran, dan laporan…';
    return await runServer('apiFinalizeEditReplacementUpload',upload.sessionId);
  }catch(error){
    const message=error.message||String(error);
    if(/UPLOAD_SESSION_(EXPIRED|NOT_FOUND)/.test(message)){
      upload.sessionId='';upload.uploadedBytes=0;
    }
    throw error;
  }
}

async function deleteWithEvidenceUpload(payload,file,button){
  const signature=JSON.stringify(payload)+'|'+file.name+'|'+file.size+'|'+(file.type||'');

  if(upload&&upload.signature!==signature){
    if(upload.sessionId){try{await runServer('apiCancelDeletionEvidenceUpload',upload.sessionId)}catch(ignore){}}
    upload=null;
  }
  if(!upload){
    upload={signature:signature,sessionId:'',uploadedBytes:0,chunkSize:512*1024,file:file,payload:payload};
    state.deletionUpload=upload;
  }
  try{
    if(!upload.sessionId){
      const request=Object.assign({},payload,{
        evidenceName:file.name,
        evidenceSize:file.size,
        evidenceType:file.type||''
      });
      const started=await runServer('apiStartDeletionEvidenceUpload',request);
      upload.sessionId=started.sessionId;
      upload.chunkSize=started.chunkSize||upload.chunkSize;
      upload.uploadedBytes=started.uploadedBytes||0;
    }else{
      const status=await runServer('apiGetDeletionEvidenceUploadStatus',upload.sessionId);
      if(status.committed&&status.result)return status.result;
      upload.uploadedBytes=status.uploadedBytes||0;
    }

    while(upload.uploadedBytes<file.size){
      const start=upload.uploadedBytes;
      const end=Math.min(start+upload.chunkSize,file.size);
      const base64=await fileSliceToBase64(file.slice(start,end,file.type||'application/octet-stream'));
      const progress=await runServer('apiUploadDeletionEvidenceChunk',{
        sessionId:upload.sessionId,
        start:start,
        end:end,
        total:file.size,
        base64:base64
      });
      if(Number(progress.uploadedBytes)<=start)throw new Error('Drive belum menerima potongan bukti disposisi. Klik kembali tombol pembatalan.');
      upload.uploadedBytes=Number(progress.uploadedBytes);
      const percent=Math.min(100,Math.floor(upload.uploadedBytes/file.size*100));
      button.textContent='Upload bukti '+percent+'%';
      $('deletionStatus').textContent='Mengunggah bukti disposisi: '+percent+'%. Data arsip belum dibatalkan.';
    }
    button.textContent='Menyelesaikan…';
    $('deletionStatus').textContent='Bukti lengkap. Menjalankan pembatalan, penomoran ulang, dan pembaruan laporan…';
    return await runServer('apiFinalizeDeletionEvidenceUpload',upload.sessionId);
  }catch(error){
    const message=error.message||String(error);
    if(/UPLOAD_SESSION_(EXPIRED|NOT_FOUND)/.test(message)){
      upload.sessionId='';
      upload.uploadedBytes=0;
    }
    throw error;
  }
}

async function loadReceiptFilingOptions(force=false){
  if(state.receiptFilingOptions&&!force){
    renderReceiptFilingQueue_();
    return;
  }
  $('receiptFilingEmpty').hidden=false;
  $('receiptFilingEmpty').textContent='Memuat item penerimaan yang belum diberkaskan…';
  $('receiptFilingTableWrap').hidden=true;
  $('refreshReceiptFiling').disabled=true;
  try{
    state.receiptFilingOptions=await runServer('apiGetReceiptFilingOptions');
    const available=new Set((state.receiptFilingOptions.items||[]).map(item=>item.id));
    state.selectedReceiptItemIds=new Set(
      [...state.selectedReceiptItemIds].filter(id=>available.has(id))
    );
    renderReceiptFilingQueue_();
  }catch(error){
    $('receiptFilingEmpty').textContent='Antrean belum dapat dimuat: '+error.message;
    toast(error.message,true);
  }finally{
    $('refreshReceiptFiling').disabled=false;

function visibleReceiptFilingItems_(){
  const query=normalizeFolderLabelFilter_($('receiptFilingSearch').value);
  return (state.receiptFilingOptions&&state.receiptFilingOptions.items||[])
    .filter(item=>{
      if(!query)return true;
      const corpus=normalizeFolderLabelFilter_([
        item.receiptNumber,item.senderName,item.senderUnit,
        item.primaryLetterNumber,item.alternateLetterNumber,
        item.documentDate,item.description,item.condition,
        item.securityClassification
      ].join(' '));
      return query.split(' ').filter(Boolean).every(token=>corpus.includes(token));
    });
}

function renderReceiptFilingQueue_(){
  const options=state.receiptFilingOptions;
  if(!options)return;
  const rows=visibleReceiptFilingItems_();
  const summary=options.summary||{};
  $('receiptFilingStats').textContent=
    (summary.pending||0)+' siap · '+(summary.incomplete||0)+
    ' perlu dilengkapi · '+(summary.filed||0)+' sudah diberkaskan'+
    (options.truncated?' · menampilkan 500 antrean terlama':'');
  $('receiptFilingBody').innerHTML=rows.map(item=>{
    const checked=state.selectedReceiptItemIds.has(item.id)?' checked':'';
    const disabled=item.selectable?'':' disabled';
    const status=item.selectable
      ?'<span class="status-badge success">Siap</span>'
      :'<span class="status-badge warning">Lengkapi metadata</span>';
    const number=item.primaryLetterNumber||item.alternateLetterNumber||'Tanpa nomor surat';
    return '<tr>'+
      '<td><input type="checkbox" data-receipt-filing-id="'+escapeHtml(item.id)+'"'+checked+disabled+' aria-label="Pilih item"></td>'+
      '<td><span class="search-number">'+escapeHtml(item.receiptNumber)+' · '+escapeHtml(item.receiptItemNumber)+'</span>'+
        '<span class="search-cell-sub">'+escapeHtml(item.senderName)+' — '+escapeHtml(item.senderUnit)+'</span></td>'+
      '<td><span class="search-cell-main">'+escapeHtml(formatArchiveDate(item.documentDate))+'</span>'+
        '<span class="search-cell-sub">'+escapeHtml(number)+'</span></td>'+
      '<td><div class="search-description">'+escapeHtml(item.description)+'</div>'+
        '<span class="search-cell-sub">'+escapeHtml(item.notes||'')+'</span></td>'+
      '<td>'+status+'<span class="search-cell-sub">'+escapeHtml(item.pageCount)+' hlm · '+
        escapeHtml(item.developmentLevel)+' · '+escapeHtml(receiptTitleCase_(item.condition))+' · '+
        escapeHtml(receiptSecurityLabel_(item.securityClassification))+'</span></td>'+

}

function renderReceiptFilingSelection_(){
  const selected=(state.receiptFilingOptions&&state.receiptFilingOptions.items||[])
    .filter(item=>state.selectedReceiptItemIds.has(item.id));
  const pages=selected.reduce((sum,item)=>sum+Number(item.pageCount||0),0);
  const security=mostRestrictiveSecurityClient_(selected);
  $('receiptFilingSelected').textContent=selected.length
    ?selected.length+' item terpilih · '+pages+' halaman · keamanan berkas '+

async function saveReceiptFiling_(event){
  event.preventDefault();
  try{validateBeforeSave()}catch(error){toast(error.message,true);return}
  const button=$('saveItem');
  if(!state.receiptFilingRequestId){
    state.receiptFilingRequestId='RBF-'+Date.now().toString(36).toUpperCase()+'-'+
      Math.random().toString(36).slice(2,10).toUpperCase();
  }
  updateClassificationId();
  const mode=$('berkasMode').value;
  if(mode==='NEW'&&!$('newBerkasId').value)$('newBerkasId').value=newClientId('BRK');
  const payload=formPayloadWithoutFiles($('archiveForm'));
  payload.requestId=state.receiptFilingRequestId;
  payload.receiptItemIds=[...state.selectedReceiptItemIds];
  button.disabled=true;
  button.textContent='Memberkaskan…';
  showItemSavingOverlay();
  $('loadingTitle').textContent='Memberkaskan item penerimaan';
  $('loadingMessage').textContent='Memvalidasi item terpilih dan menghitung nomor kronologis…';
  try{
    let result;
    try{
      result=await runServerWithTimeout_(60000,'apiCommitReceiptFiling',payload);
    }catch(error){
      if(error.code!=='SERVER_TIMEOUT')throw error;
      $('loadingMessage').textContent='Respons terlambat. Memverifikasi hasil penyimpanan…';
      const recovery=await runServerWithTimeout_(
        30000,'apiRecoverReceiptFiling',payload.requestId,payload.receiptItemIds);
      if(!recovery||!recovery.found)throw error;
      result=recovery;
    }
    const selectedCount=state.selectedReceiptItemIds.size;
    state.selectedReceiptItemIds.clear();
    state.receiptFilingRequestId='';
    state.receiptFilingOptions=null;
    state.receiptOptions=null;
    state.editOptions=null;
    state.deletionOptions=null;
    state.mediaOptions=null;
    resetNewBerkasFields();
    runServer('apiRefreshReceiptFilingReports',result.requestId)
      .catch(error=>toast(
        'Data utama tersimpan, tetapi laporan belum tersinkron: '+error.message,
        true
      ));
    await Promise.all([
      loadBootstrap(result.berkasId),
      loadReceiptFilingOptions(true)
    ]);
    lockBerkas(result.berkasId,
      'Berkas '+(result.berkasNumber||'')+' – '+(result.berkasTitle||''));
    const duration=result.durationMs
      ?' · '+Math.max(.1,result.durationMs/1000).toFixed(1)+' detik':'';
    const warning=result.warnings&&result.warnings.length
      ?' Peringatan: '+result.warnings.join(' | '):'';
    $('formStatus').textContent=selectedCount+' item berhasil diberkaskan'+duration+
      '. Laporan sedang disegarkan di latar belakang.'+warning;
    toast(result.message,Boolean(result.warnings&&result.warnings.length));
  }catch(error){
    $('formStatus').textContent='Pemberkasan belum berhasil: '+error.message;
    toast(error.message,true);
  }finally{
    hideItemSavingOverlay();
    button.disabled=false;
    button.textContent='Berkaskan Item Terpilih';
  }
}

function validateBeforeSave(){
  const mode=$('berkasMode').value;
  if(state.pendingUpload)throw new Error('Tunggu upload item sebelumnya selesai. Anda tetap dapat mengetik item berikutnya.');
  if(mode==='EXISTING'&&!(state.lockedBerkasId||$('itemBerkasId').value))throw new Error('Pilih berkas induk terlebih dahulu.');
  if(mode==='NEW'){
    if(!$('title').value.trim())throw new Error('Judul berkas wajib diisi.');
    if(!$('classificationId').value)throw new Error('Kode klasifikasi wajib dipilih.');
    if($('activeRetentionValue').value===''||$('inactiveRetentionValue').value==='')throw new Error('Retensi aktif dan inaktif wajib diisi.');
    if(!$('finalDisposition').value)throw new Error('Nasib akhir wajib dipilih.');
  }
  if(state.inputSourceMode==='RECEIPT'){
    if(!state.selectedReceiptItemIds.size)throw new Error('Pilih minimal satu item dari Penerimaan Arsip.');
    if(state.selectedReceiptItemIds.size>100)throw new Error('Satu transaksi maksimal memuat 100 item.');
    return;
  }
  const file=$('pdfFile').files[0];
  if(file&&file.type&&file.type!=='application/pdf')throw new Error('Berkas utama harus PDF.');
  if(file&&file.size>=ARCHIVE_MEDIA_MAX_BYTES)throw new Error('Ukuran PDF harus kurang dari 100 MB.');
}
