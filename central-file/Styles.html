<style>
:root{
  --navy:#0B4D2C;--navy-dark:#062E1D;--blue:#0B4D2C;--blue-dark:#062E1D;
  --sky:#F0FDF4;--ink:#1E293B;--muted:#64748B;--line:#E2E8F0;--bg:#F8FAFC;--white:#fff;
  --danger:#DC2626;--warning:#946C26;--success:#12633C;
  --gold:#C4A163;--gold-dark:#946C26;--gold-bg:#FAF5E8;--gold-line:#F4E6C3;
  --green-50:#F0FDF4;--green-100:#E8F5EE;--green-200:#D1E7DD;--green-700:#12633C;
  --table-head-bg:#F0F7F4;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-full:9999px;
  --shadow-subtle:0 4px 16px -2px rgba(15,23,42,.05);--shadow-tile:0 2px 5px rgba(0,0,0,.06);
  --shadow-tile-active:0 4px 12px rgba(11,77,44,.22);--shadow-modal:0 20px 45px -5px rgba(15,23,42,.18);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}

/* ==================== APP SHELL / SIDEBAR ==================== */
.app-shell{min-height:100vh;display:grid;grid-template-columns:272px 1fr}
.sidebar{background:var(--white);color:var(--ink);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:0}
.brand{display:flex;gap:12px;align-items:center;margin:14px;padding:12px 14px;background:var(--green-50);border:1px solid var(--green-200);border-radius:var(--radius-md)}
.brand-mark{width:42px;height:42px;border-radius:var(--radius-md);display:grid;place-items:center;background:var(--white);border:1.5px solid var(--gold);box-shadow:var(--shadow-tile);flex-shrink:0}
.brand-mark svg{width:26px;height:26px}
.brand strong{display:block;font-size:12px;font-weight:800;color:var(--navy);text-transform:uppercase;letter-spacing:.02em}
.brand small{display:block;color:var(--muted);margin-top:2px;font-size:11px}
.sidebar nav{flex:1;overflow-y:auto;padding:2px 14px 14px;display:flex;flex-direction:column;gap:3px}
.nav-section-title,.nav-group-title{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:#94A3B8;padding:14px 10px 6px}
.nav-button{border:0;background:transparent;color:var(--ink);text-align:left;padding:9px 10px;border-radius:var(--radius-md);cursor:pointer;display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:500;transition:background .15s,color .15s;width:100%}
.nav-button .nav-icon{width:34px;height:34px;border-radius:var(--radius-md);background:#F1F5F9;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;flex-shrink:0;transition:all .15s}
.nav-button.nav-sub{padding-left:26px}
.nav-button.nav-sub .nav-icon{display:none}
.nav-button:hover{background:#F1F5F9;color:var(--navy)}
.nav-button:hover .nav-icon{background:var(--white);border-color:#CBD5E0}
.nav-button.active{background:var(--green-50);color:var(--navy);font-weight:700}
.nav-button.active .nav-icon{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:var(--shadow-tile-active)}
.nav-button:disabled{opacity:.55;cursor:not-allowed}
.nav-button span.nav-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-button span.nav-badge{background:var(--navy);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:var(--radius-full)}
.nav-button:not(.active) span.nav-badge{background:var(--gold-bg);color:var(--gold-dark);border:1px solid var(--gold-line)}
.nav-dropdown{display:flex;flex-direction:column}
.nav-dropdown-toggle span.nav-caret{font-size:11px;color:var(--muted);transition:transform .15s;flex-shrink:0}
.nav-dropdown-toggle.active span.nav-caret{transform:rotate(180deg);color:var(--navy)}
.nav-dropdown-menu{display:flex;flex-direction:column;gap:3px;margin-top:3px}
.sidebar-footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sidebar-avatar{width:36px;height:36px;border-radius:var(--radius-full);background:var(--green-100);border:1px solid var(--green-200);color:var(--navy);font-weight:800;font-size:13px;display:grid;place-items:center;flex-shrink:0}
.sidebar-footer-meta{overflow:hidden;font-size:12px;line-height:1.3}
.sidebar-footer-meta strong{display:block;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-footer-meta span{color:var(--muted);font-size:11px}

/* ==================== TOPBAR ==================== */
.content{min-width:0;padding:0;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:0 32px;height:70px;flex-shrink:0;background:var(--white);border-bottom:1px solid var(--line)}
.topbar-crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:#94A3B8;white-space:nowrap}
.topbar-crumbs strong{color:var(--navy);font-weight:700}
.topbar h1{margin:0;font-size:26px}
.topbar p{margin:4px 0 0;color:var(--muted)}
.topbar-search{flex:1;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-full);padding:8px 16px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;cursor:pointer;transition:all .15s}
.topbar-search:hover{border-color:var(--navy);background:var(--white);box-shadow:0 0 0 3px rgba(11,77,44,.08)}
.topbar-search span.kbd{margin-left:auto;background:var(--white);border:1px solid #CBD5E0;border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:var(--muted)}
.topbar-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.user-badge{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-full);padding:7px 12px;color:var(--muted);white-space:nowrap}
.content-scroll{flex:1;overflow-y:auto;padding:28px 32px 40px}

.page{display:none}
.page.active{display:block;animation:fadeIn .2s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* ==================== SUB-TAB BAR (halaman dalam satu grup) ==================== */
.sub-nav-tabs{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.sub-tab-btn{padding:9px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--muted);background:var(--white);border:1px solid var(--line);cursor:pointer;text-decoration:none;transition:all .15s}
.sub-tab-btn:hover{background:#F1F5F9;color:var(--ink)}
.sub-tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;box-shadow:var(--shadow-tile)}

/* ==================== STAT / KPI CARDS ==================== */
.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:14px}
.stat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-subtle);transition:transform .15s,box-shadow .15s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px -2px rgba(15,23,42,.08)}
.stat-card .stat-icon{width:44px;height:44px;border-radius:var(--radius-md);display:grid;place-items:center;font-size:19px;flex-shrink:0;background:var(--green-100);border:1px solid var(--green-200);color:var(--navy)}
.stat-card.warning .stat-icon,.stat-card.danger .stat-icon{background:var(--gold-bg);border-color:var(--gold-line);color:var(--gold-dark)}
.stat-card span{display:block;color:var(--muted);margin-bottom:2px;font-size:11.5px;font-weight:600}
.stat-card strong{font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat-card.warning strong{color:var(--warning)}
.stat-card.danger strong{color:var(--danger)}
.stat-card.success strong{color:var(--success)}

/* ==================== CARDS / FORMS ==================== */
.empty-state,.form-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);margin-top:18px;padding:26px 28px;box-shadow:var(--shadow-subtle)}
.empty-state{text-align:center;padding:52px 24px}
.empty-state h2{margin:0 0 6px}
.empty-state p{color:var(--muted);margin:0 0 20px}
.section-heading{display:flex;justify-content:space-between;align-items:start;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.section-heading.compact{margin-top:28px}
.section-heading h2{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.section-heading p{margin:3px 0 0;color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:grid;gap:6px;font-weight:600;font-size:12.5px;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;height:40px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px;background:#FAFAFA;color:var(--ink);font-weight:400;font-size:13.5px;transition:all .15s}
.field textarea{height:auto}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;background:var(--white);border-color:var(--navy);box-shadow:0 0 0 3px rgba(11,77,44,.1)}
.field input:disabled{background:#F1F5F9;color:var(--muted)}
.field small,.helper{font-size:11px;color:var(--muted);font-weight:400}
.span-2{grid-column:span 2}
.span-3{grid-column:span 3}
.input-pair{display:grid;grid-template-columns:1fr 110px}
.input-pair input{border-radius:var(--radius-sm) 0 0 var(--radius-sm)}
.input-pair select{border-radius:0 var(--radius-sm) var(--radius-sm) 0;border-left:0}
.form-actions{display:flex;justify-content:flex-end;align-items:center;gap:16px;border-top:1px solid var(--line);margin-top:28px;padding-top:18px}
.form-actions span{margin-right:auto;color:var(--muted)}
button.primary,button.secondary{border:0;border-radius:var(--radius-sm);padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;transition:all .15s}
button.primary{background:var(--navy);color:#fff;box-shadow:var(--shadow-tile)}
button.primary:hover{background:var(--navy-dark);box-shadow:var(--shadow-tile-active)}
button.primary:disabled{opacity:.55;cursor:wait}
button.secondary{background:var(--white);border:1px solid #CBD5E0;color:#334155}
button.secondary:hover{background:#F1F5F9;color:var(--ink)}
.toast{position:fixed;right:24px;bottom:24px;max-width:380px;background:#111827;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 12px 30px #0003;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:1200}
.toast.show{opacity:1;transform:none}
.toast.error{background:#8f1d18}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:none;place-items:center;padding:24px;z-index:1000}
.modal.open{display:grid}
.modal-card{width:min(760px,100%);max-height:90vh;overflow:auto;background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-modal)}
.modal-header{display:flex;justify-content:space-between;align-items:start;padding:22px 24px;border-bottom:1px solid var(--line)}
.modal-header h2{margin:0}
.modal-header p{margin:4px 0 0;color:var(--muted)}
.icon-button{border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}
.impact-summary{margin:20px 24px;padding:14px;background:var(--sky);border-radius:9px;color:var(--navy);font-weight:700}
.impact-list{padding:0 24px;display:grid;gap:10px}
.impact-group{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.impact-group h3{margin:0;padding:10px 12px;background:var(--table-head-bg);font-size:14px}
.impact-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:9px 12px;border-top:1px solid #eef2f6}
.impact-row span:last-child{font-weight:700;color:var(--navy)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;padding:20px 24px;border-top:1px solid var(--line);margin-top:20px}
@media(max-width:980px){.app-shell{grid-template-columns:200px 1fr}.content-scroll{padding:20px}.stat-grid{grid-template-columns:repeat(2,1fr)}.form-grid,.form-grid.three{grid-template-columns:1fr}.span-2,.span-3{grid-column:span 1}}
@media(max-width:700px){.app-shell{display:block}.sidebar{height:auto;position:static}.content{height:auto}.content-scroll{padding:16px}.topbar{flex-wrap:wrap;height:auto;padding:14px}}

.mode-switch{display:flex;gap:8px;margin:0 0 18px}
.mode-button{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--white);color:#334155;padding:10px 14px;font-weight:700;cursor:pointer}
.mode-button.active{border-color:var(--navy);background:var(--sky);color:var(--navy)}
.locked-summary{display:grid;gap:3px;padding:15px 16px;border:1px solid var(--green-200);border-radius:var(--radius-md);background:var(--green-50);color:#14532d}
.locked-summary span{font-size:15px}
.locked-summary small{color:#3f6d50}
.upload-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:9px;background:var(--gold-bg);border:1px solid var(--gold-line);color:var(--gold-dark)}
.upload-banner.success{background:var(--green-50);border-color:var(--green-200);color:#166534}
.upload-banner.error{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.item-heading{margin-top:32px}
.item-heading h2{color:var(--navy)}

.danger-panel{display:grid;gap:4px;margin-bottom:20px;padding:14px 16px;border:1px solid #fecaca;border-radius:var(--radius-md);background:#fef2f2;color:#991b1b}
.danger-panel span{color:#7f1d1d}
.deletion-impact{padding:14px 16px;border:1px solid var(--gold-line);border-radius:9px;background:var(--gold-bg);color:var(--gold-dark);line-height:1.55}
.danger-button{border:0;border-radius:var(--radius-sm);padding:10px 16px;background:var(--danger);color:#fff;font-weight:700;cursor:pointer}
.danger-button:hover{background:#B91C1C}
.danger-button:disabled{opacity:.55;cursor:wait}

.info-panel{display:grid;gap:4px;margin-bottom:20px;padding:14px 16px;border:1px solid var(--green-200);border-radius:var(--radius-md);background:var(--green-50);color:#0d3d24}
.current-file{align-content:start}
.current-file>span{font-weight:600}
.current-file a{display:block;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;background:var(--table-head-bg);color:var(--navy);font-weight:400;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.current-file a.disabled{color:var(--muted);pointer-events:none}

.loading-overlay{position:fixed;inset:0;z-index:1300;display:grid;place-items:center;padding:24px;background:rgba(15,23,42,.6);backdrop-filter:blur(2px)}
.loading-card{width:min(430px,100%);display:grid;justify-items:center;gap:10px;padding:30px 28px;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--white);box-shadow:var(--shadow-modal);text-align:center}
.loading-card h2{margin:4px 0 0;font-size:20px;color:var(--navy)}
.loading-card p{min-height:42px;margin:0;color:#475569}
.loading-card small{color:var(--muted)}
.loading-spinner{width:44px;height:44px;border:4px solid var(--green-100);border-top-color:var(--navy);border-radius:50%;animation:loading-spin .8s linear infinite}
@keyframes loading-spin{to{transform:rotate(360deg)}}
.inline-spinner{display:inline-block;width:13px;height:13px;margin-right:7px;vertical-align:-2px;border:2px solid #cbd5e1;border-top-color:var(--navy);border-radius:50%;animation:loading-spin .8s linear infinite}

.search-filters{margin-top:16px}
.search-results-card{padding:0;overflow:hidden}
.search-results-card .section-heading{padding:22px 24px 16px;margin:0}
.search-empty{padding:42px 24px;text-align:center;color:var(--muted)}
.search-table-wrap{overflow:auto}
.search-table{width:100%;min-width:1120px;border-collapse:collapse;font-size:13px}
.search-table th{position:sticky;top:0;z-index:1;padding:11px 12px;background:var(--table-head-bg);color:var(--navy);font-size:11px;font-weight:700;letter-spacing:.03em;text-align:left;border-bottom:1px solid var(--line)}
.search-table td{padding:13px 12px;vertical-align:top;border-bottom:1px solid #e8eef3}
.search-table tbody tr:hover{background:#F8FBF9}
.search-number{font-weight:800;color:var(--navy);white-space:nowrap}
.search-cell-main{display:block;font-weight:700;color:#334155}
.search-cell-sub{display:block;margin-top:4px;color:var(--muted);font-size:12px}
.search-description{max-width:430px;line-height:1.5}
.search-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.status-badge{display:inline-flex;align-items:center;border-radius:var(--radius-full);padding:3px 9px;background:#eef2f6;color:#475569;font-size:11px;font-weight:700;white-space:nowrap}
.status-badge.success{background:var(--green-100);color:#166534}
.status-badge.warning{background:var(--gold-bg);color:var(--gold-dark)}
.status-badge.loan{background:var(--gold-bg);color:var(--gold-dark)}
.status-badge.danger{background:#fee2e2;color:#991b1b}
.search-actions{display:grid;gap:7px;min-width:105px}
.search-link{display:inline-flex;justify-content:center;border-radius:var(--radius-sm);padding:7px 10px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;text-decoration:none}
.search-link.secondary-link{border:1px solid var(--line);background:var(--white);color:var(--navy)}
.search-link.disabled{pointer-events:none;background:#e2e8f0;color:#94a3b8}

.label-picker-card{padding-bottom:0}
.label-toolbar{display:grid;grid-template-columns:minmax(280px,2fr) minmax(180px,1fr) minmax(220px,1fr);gap:16px}
.label-selection-actions{display:flex;align-items:center;gap:10px;margin:20px -28px 0;padding:14px 28px;border-top:1px solid var(--line);background:var(--bg)}
.label-selection-actions span{margin-left:auto;color:var(--muted);font-weight:700}
.label-table-wrap{margin:0 -28px;max-height:480px;overflow:auto;border-top:1px solid var(--line)}
.label-table{width:100%;min-width:900px;border-collapse:collapse}
.label-table th{position:sticky;top:0;z-index:2;padding:11px 12px;background:var(--table-head-bg);color:var(--navy);font-size:12px;text-align:left;border-bottom:1px solid var(--line)}
.label-table td{padding:12px;vertical-align:middle;border-bottom:1px solid #e8eef3}
.label-table tbody tr:hover{background:#F8FBF9}
.label-check-column{width:46px;text-align:center!important}
.label-check-column input{width:17px;height:17px;accent-color:var(--navy);cursor:pointer}
.label-location{max-width:180px;line-height:1.4}
.label-preview-card{margin-top:18px}
.folder-label-preview{width:min(680px,100%);display:grid;grid-template-columns:1fr 1fr;margin:0 auto;border-top:2px solid #111;border-left:2px solid #111;background:#fff}
.folder-label-sample{position:relative;aspect-ratio:7/3;display:flex;flex-direction:column;gap:6px;padding:8px 54px 7px 9px;border-right:2px solid #111;border-bottom:2px solid #111;overflow:hidden;font-family:"Times New Roman",serif;color:#111}
.folder-label-sample strong{font-size:13px;line-height:1.05}
.folder-label-sample span{display:-webkit-box;overflow:hidden;font-size:11px;line-height:1.12;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.folder-label-sample em{position:absolute;right:8px;top:8px;display:grid;place-items:center;width:36px;height:36px;border:2px solid #0c5138;color:#0c5138;font:700 8px Arial,sans-serif;font-style:normal}
.folder-label-sample.empty{justify-content:center;align-items:center;padding:8px;color:#94a3b8;font-family:Arial,sans-serif;background:var(--bg)}
.folder-label-sample.empty span{font-size:10px}
.label-preview-card .form-actions{margin-bottom:0}
@media(max-width:980px){.label-toolbar{grid-template-columns:1fr}.label-selection-actions{align-items:stretch;flex-wrap:wrap}.label-selection-actions span{width:100%;margin-left:0}.folder-label-preview{width:100%}}
@media(max-width:620px){.folder-label-preview{grid-template-columns:1fr}.folder-label-sample{aspect-ratio:7/3}}

.retention-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}
.retention-toolbar{display:grid;grid-template-columns:minmax(280px,2fr) minmax(180px,1fr);gap:16px;margin-bottom:18px}
.retention-list-card{padding-bottom:0}
.retention-table-wrap{margin:0 -28px;overflow:auto;border-top:1px solid var(--line)}
.retention-table{width:100%;min-width:1180px;border-collapse:collapse}
.retention-table th{position:sticky;top:0;z-index:2;padding:11px 12px;background:var(--table-head-bg);color:var(--navy);font-size:12px;text-align:left;border-bottom:1px solid var(--line)}
.retention-table td{padding:13px 12px;vertical-align:top;border-bottom:1px solid #e8eef3}
.retention-table tbody tr:hover{background:#F8FBF9}
.retention-actions{display:grid;gap:7px;min-width:155px}
.retention-action-button{border:0;border-radius:7px;padding:8px 10px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.retention-action-button:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}
.retention-folder-link{display:inline-block;margin-top:5px;color:var(--navy);font-size:12px;font-weight:700;text-decoration:none}
