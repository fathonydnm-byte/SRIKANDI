name: v4 deploy (staging)

# Memasang v4/web ke Cloudflare Pages. Butuh secret repo CLOUDFLARE_API_TOKEN
# (izin Cloudflare Pages: Edit). URL dan anon key Supabase bersifat publik
# (ikut terkirim ke browser); keamanan data dijaga oleh RLS, bukan oleh kunci ini.
# Hanya dijalankan manual setelah review, supaya commit WIP tidak ikut tayang di staging.
on:
  workflow_dispatch:

concurrency:
  group: v4-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: v4/web
    env:
      VITE_SUPABASE_URL: https://bycimuphbyfkwywcbsvx.supabase.co
      VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5Y2ltdXBoYnlma3d5d2Nic3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1MjQ3NTAsImV4cCI6MjExMDEwMDc1MH0.nNrxdoXwZhMeHeTeMtA6oj_nU-_tpCQXrAOcafwPgcg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v4/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy ke Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 086770a878487f48fe09ecf027db1a77
        run: npx --yes wrangler@4 pages deploy dist --project-name central-file-uinsa --branch main
